<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber-Gogircin Empire</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --cyan: #00f2ff; --pink: #ff00ff; --bg: #0a0a0a; --gold: #ffd700; --silver: #e0e0e0; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; height: 100vh; overflow: hidden; user-select: none; }
        
        .header { padding: 10px; display: flex; justify-content: space-around; border-bottom: 2px solid var(--cyan); background: rgba(0,0,0,0.8); position: sticky; top: 0; z-index: 100; }
        .stat { text-align: center; font-size: 11px; font-weight: bold; }

        .screen { display: none; height: calc(100vh - 140px); overflow-y: auto; padding: 20px; flex-direction: column; align-items: center; }
        .screen.active { display: flex; }

        /* CANLI KUŞ ANİMASYONU */
        .bird-box { position: relative; width: 150px; height: 150px; margin: 20px 0; }
        .main-bird { font-size: 100px; cursor: pointer; transition: 0.1s; display: inline-block; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-15px) rotate(5deg); } }
        .main-bird:active { transform: scale(0.8); }

        /* MARKET KARTLARI */
        .shop-card { background: #1a1a1a; border: 1px solid var(--cyan); border-radius: 15px; width: 95%; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .bird-info { display: flex; align-items: center; gap: 15px; }
        .bird-icon { font-size: 40px; }
        .btn-buy { background: #0088cc; color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* BARLAR */
        .bar-wrap { width: 90%; margin: 8px 0; }
        .bar-bg { width: 100%; height: 10px; background: #222; border-radius: 5px; overflow: hidden; border: 1px solid #333; }
        .bar-fill { height: 100%; transition: width 0.3s; }

        .nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 2px solid var(--cyan); }
        .nav-item { color: #555; font-size: 10px; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--cyan); }
    </style>
</head>
<body>

    <div class="header">
        <div class="stat" style="color:var(--gold)">🟡 ALTIN<br><span id="h-gold">0</span></div>
        <div class="stat" style="color:var(--silver)">⚪ GÜMÜŞ<br><span id="h-silv">0</span></div>
        <div class="stat" style="color:var(--cyan)">🥚 YUMURTA<br><span id="h-egg">0</span></div>
    </div>

    <div id="s-game" class="screen active">
        <div class="bird-box">
            <div class="main-bird" id="current-bird">🕊️</div>
        </div>
        <div class="bar-wrap">
            <div style="font-size:10px; color:#00ff88">ENERJİ: <span id="en-txt">100/100</span></div>
            <div class="bar-bg"><div class="bar-fill" id="en-bar" style="background:#00ff88; width:100%"></div></div>
        </div>
        <div class="bar-wrap">
            <div style="font-size:10px; color:var(--pink)">SEPET: <span id="sp-txt">0/20</span></div>
            <div class="bar-bg"><div class="bar-fill" id="sp-bar" style="background:var(--pink); width:0%"></div></div>
        </div>
        <button style="background:var(--pink); border:none; padding:15px; width:90%; border-radius:15px; font-weight:bold; color:white; margin-top:10px;" onclick="collect()">HASAT ET</button>
        <button style="background:var(--gold); border:none; padding:12px; width:90%; border-radius:15px; font-weight:bold; margin-top:10px;" onclick="startAd()">📺 REKLAM İZLE (ENERJİ + 10X)</button>
    </div>

    <div id="s-market" class="screen">
        <h3 style="color:var(--cyan)">TON COIN MARKET</h3>
        <div class="shop-card">
            <div class="bird-info"><span class="bird-icon">🦜</span> <div><b>Yeşil Kuş</b><br><small>Hız: 2X</small></div></div>
            <button class="btn-buy" onclick="buyBird('🦜', 2, 2)">2 TON</button>
        </div>
        <div class="shop-card">
            <div class="bird-info"><span class="bird-icon">🦚</span> <div><b>Mavi Tavus</b><br><small>Hız: 5X</small></div></div>
            <button class="btn-buy" onclick="buyBird('🦚', 5, 5)">5 TON</button>
        </div>
        <div class="shop-card">
            <div class="bird-info"><span class="bird-icon">🦉</span> <div><b>Gece Baykuşu</b><br><small>Hız: 10X</small></div></div>
            <button class="btn-buy" onclick="buyBird('🦉', 10, 10)">10 TON</button>
        </div>
        <div class="shop-card">
            <div class="bird-info"><span class="bird-icon">🦅</span> <div><b>Altın Kartal</b><br><small>Hız: 25X</small></div></div>
            <button class="btn-buy" onclick="buyBird('🦅', 25, 20)">20 TON</button>
        </div>
    </div>

    <div id="s-ref" class="screen">
        <h3 style="color:var(--cyan)">REFERANS SİSTEMİ</h3>
        <div style="background:#1a1a1a; padding:20px; border-radius:15px; text-align:center; width:90%;">
            <p>Davet ettiğin her kişi için <b>5.000 Gümüş</b> kazan!</p>
            <input type="text" id="ref-link" readonly style="width:100%; background:#000; color:var(--cyan); border:1px solid var(--cyan); padding:10px; border-radius:10px; text-align:center; margin-bottom:10px;">
            <button style="background:var(--cyan); color:black; border:none; padding:10px 20px; border-radius:10px; font-weight:bold;" onclick="copyRef()">LİNKİ KOPYALA</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" id="n-game" onclick="show('game')">🏠<br>KÜMES</div>
        <div class="nav-item" id="n-market" onclick="show('market')">🛒<br>MARKET</div>
        <div class="nav-item" id="n-ref" onclick="show('ref')">👥<br>REF</div>
        <div class="nav-item" onclick="tg.close()">❌<br>KAPAT</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        let gold=0, silv=0, curE=0, savE=0, energy=100, mult=1;

        function show(s) {
            document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
            document.getElementById('s-'+s).classList.add('active');
            document.getElementById('n-'+s).classList.add('active');
            if(s==='ref') document.getElementById('ref-link').value = "https://t.me/BotLinkin?start=" + tg.initDataUnsafe.user.id;
        }

        setInterval(() => {
            if(energy > 0 && curE < 20) {
                curE += (0.02 * mult);
                energy -= 0.05;
                updateUI();
            }
        }, 1000);

        function updateUI() {
            document.getElementById('h-gold').innerText = Math.floor(gold);
            document.getElementById('h-silv').innerText = Math.floor(silv);
            document.getElementById('h-egg').innerText = Math.floor(savE);
            document.getElementById('en-bar').style.width = energy + "%";
            document.getElementById('en-txt').innerText = Math.floor(energy) + "/100";
            document.getElementById('sp-bar').style.width = (curE/20*100) + "%";
            document.getElementById('sp-txt').innerText = Math.floor(curE) + "/20";
        }

        function collect() {
            if(energy >= 10 && curE >= 1) { savE += Math.floor(curE); curE = 0; energy -= 10; updateUI(); }
        }

        function buyBird(icon, speed, price) {
            tg.showConfirm(price + " TON karşılığında bu kuşu almak istiyor musunuz?", (ok) => {
                if(ok) {
                    document.getElementById('current-bird').innerText = icon;
                    mult = speed;
                    tg.showAlert("Yeni kuşun hayırlı olsun! Hızın: " + speed + "X");
                    show('game');
                }
            });
        }

        function copyRef() {
            let link = document.getElementById('ref-link');
            link.select();
            document.execCommand('copy');
            tg.showAlert("Referans linkin kopyalandı!");
        }

        function startAd() {
            tg.showAlert("Reklam izleniyor... (15sn)");
            setTimeout(() => { energy = 100; updateUI(); tg.showAlert("Enerji Fullendi!"); }, 2000);
        }

        document.getElementById('current-bird').onclick = () => {
            if(energy > 0 && curE < 20) { curE += (0.1 * mult); energy -= 0.1; updateUI(); tg.HapticFeedback.impactOccurred('light'); }
        };
    </script>
</body>
</html>
