<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gogircin Cyber-Farm</title>
    <style>
        :root { --neon-cyan: #00f2ff; --neon-pink: #ff00ff; --bg-dark: #0a0a0b; }
        body { 
            background-color: var(--bg-dark); color: white; 
            font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }
        /* Üst Panel (Bakiye ve Enerji) */
        .top-bar {
            padding: 15px; display: flex; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); border-bottom: 1px solid var(--neon-cyan);
        }
        .stat-item { text-shadow: 0 0 10px var(--neon-cyan); font-weight: bold; }

        /* Oyun Alanı (Kuş ve Yumurtalar) */
        .game-area {
            flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
        }
        .bird-box {
            font-size: 80px; position: relative;
            filter: drop-shadow(0 0 20px var(--neon-pink));
            animation: hover 3s infinite ease-in-out;
        }
        @keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* Yumurta Sepeti Alanı */
        .basket-zone {
            width: 90%; background: rgba(0, 242, 255, 0.1);
            border: 1px dashed var(--neon-cyan); border-radius: 15px;
            padding: 10px; text-align: center; margin-bottom: 80px;
        }

        /* Alt Menü (Birds Empire Stilinde) */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background: #151517; display: flex; justify-content: space-around;
            align-items: center; border-top: 2px solid var(--neon-pink);
        }
        .nav-item { text-align: center; font-size: 12px; color: #888; text-decoration: none; }
        .nav-item.active { color: var(--neon-cyan); }
        .nav-icon { font-size: 24px; display: block; margin-bottom: 4px; }

        /* Reklam Butonu */
        .ad-btn {
            background: linear-gradient(45deg, var(--neon-pink), #800080);
            border: none; color: white; padding: 10px 20px;
            border-radius: 20px; font-weight: bold; box-shadow: 0 0 15px var(--neon-pink);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="stat-item">💰 0.00 TON</div>
        <div class="stat-item">⚡ %100</div>
    </div>

    <div class="game-area">
        <div class="bird-box">🕊️</div>
        <div style="color: var(--neon-cyan); margin-top: 10px;">CYBER-GOGIRCIN v1</div>
        <button class="ad-btn" onclick="alert('Reklam Sistemi Hazırlanıyor...')">🌾 YEM VER (AD)</button>
    </div>

    <div class="basket-zone">
        🥚 Yumurta Deposu: 0 / 20
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active"><span class="nav-icon">🏠</span>Kümes</a>
        <a href="#" class="nav-item"><span class="nav-icon">📊</span>Görevler</a>
        <a href="#" class="nav-item"><span class="nav-icon">🥚</span>Depo</a>
        <a href="#" class="nav-item"><span class="nav-icon">🛒</span>Market</a>
        <a href="#" class="nav-item"><span class="nav-icon">⚙️</span>Menü</a>
    </nav>

</body>
</html>
