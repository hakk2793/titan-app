<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin Titan</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --blue: #3b82f6; --text: #f8fafc; --green: #22c55e; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; display: block; }
        .page { display: none; padding: 20px; text-align: center; padding-bottom: 100px; }
        .active { display: block; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        .btn { background: var(--blue); color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        .nav { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #334155; }
        .nav-item { font-size: 11px; color: #94a3b8; cursor: pointer; text-align: center; flex: 1; }
    </style>
</head>
<body>
    <div id="p-home" class="page active">
        <div id="ton-connect" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>
        <div class="card">
            <p>Toplam Bakiyen</p>
            <h1 id="top-bal">0.0000</h1>
            <p style="color: var(--blue);">⚡ <span id="pph-display">0.512</span> PPH</p>
            <button class="btn" style="background: var(--green);" id="daily-btn" onclick="claimDaily()">🎁 Günlük Bonus Al</button>
        </div>
    </div>

    <div id="p-wallet" class="page">
        <h2>💰 Çekim Talebi</h2>
        <div class="card">
            <h1 id="wallet-ton">0.0000 💎</h1>
            <button class="btn" onclick="handleWithdraw()">📤 Para Çek</button>
        </div>
        <div class="card" style="text-align: left; font-size: 11px;">
            <p id="s1">✅ 1. Çekim: 1.9 TON Yatırım & Min. 1.9 TON</p>
            <p id="s2">❌ 2. Çekim: 10 Referans & Min. 50 TON</p>
            <p id="s3">❌ 3. Çekim: 50 Referans & Min. 500 TON</p>
        </div>
    </div>

    <nav class="nav">
        <div class="nav-item" onclick="showPage('p-home')">🏠<br>Home</div>
        <div class="nav-item" onclick="showPage('p-wallet')">💰<br>Wallet</div>
    </nav>

<script>
    const MY_WALLET = "UQC8qx530ORsKhEMwVVd_3UtPfjnAxKyA0DgTB1yR513oBOd";
    const tonConnectUI = new TONConnectUI.TonConnectUI({ manifestUrl: 'https://hakk2793.github.io/titan-app/tonconnect-manifest.json', buttonRootId: 'ton-connect' });

    let bal = parseFloat(localStorage.getItem('bal')) || 0;
    let pph = parseFloat(localStorage.getItem('pph')) || 0.512;
    let hasInv = localStorage.getItem('hasInv') === 'true';
    let wCount = parseInt(localStorage.getItem('wCount')) || 0;
    let lDaily = localStorage.getItem('lDaily') || 0;

    setInterval(() => { bal += pph / 3600; update(); localStorage.setItem('bal', bal); }, 1000);

    function update() {
        document.getElementById('top-bal').innerText = bal.toFixed(4);
        document.getElementById('wallet-ton').innerText = bal.toFixed(4);
        document.getElementById('pph-display').innerText = pph.toFixed(3);
        
        let now = Date.now();
        document.getElementById('daily-btn').disabled = (now - lDaily < 86400000);
    }

    function claimDaily() {
        if(Date.now() - lDaily >= 86400000) {
            bal += 0.025; lDaily = Date.now();
            localStorage.setItem('lDaily', lDaily);
            update(); Telegram.WebApp.showAlert("Hediye eklendi!");
        }
    }

    function handleWithdraw() {
        if(!hasInv) return Telegram.WebApp.showAlert("Önce 1.9 TON yatırım yapmalısın!");
        if(wCount == 0 && bal >= 1.9) prc();
        else Telegram.WebApp.showAlert("Şartlar henüz sağlanmadı!");
    }

    function prc() {
        Telegram.WebApp.showConfirm("Çekilsin mi?", (c) => { if(c) { bal=0; wCount++; update(); Telegram.WebApp.showAlert("Talep alındı."); } });
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    window.onload = () => { Telegram.WebApp.ready(); update(); };
</script>
</body>
</html>
