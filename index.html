<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Gogircin - Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --cyan: #00f2ff; --pink: #ff00ff; --gold: #ffd700; --silver: #e0e0e0; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Orbitron', sans-serif; margin: 0; overflow: hidden; }
        
        .header { display: flex; justify-content: space-around; padding: 10px; background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--cyan); position: fixed; top: 0; width: 100%; z-index: 100; }
        .stat { font-size: 12px; font-weight: bold; text-align: center; }

        /* KÜMES ALANI */
        #s-game { padding-top: 80px; height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .nests-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 90%; margin-top: 20px; }
        .nest { position: relative; background: rgba(255,255,255,0.05); border: 1px dashed #333; height: 100px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 50px; }
        .nest.active { border-color: var(--cyan); background: rgba(0,242,255,0.05); }

        /* YUMURTA ANİMASYONU */
        .egg-anim { position: absolute; font-size: 20px; z-index: 50; transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .basket-container { position: fixed; bottom: 100px; text-align: center; width: 100%; }
        .basket { font-size: 80px; filter: drop-shadow(0 0 10px var(--cyan)); }

        /* MARKET VE REF */
        .screen { display: none; padding: 80px 20px 100px; height: 100vh; overflow-y: auto; box-sizing: border-box; }
        .screen.active { display: flex; flex-direction: column; align-items: center; }
        .card { background: #111; border: 1px solid var(--cyan); border-radius: 15px; padding: 15px; margin: 10px 0; width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .btn-buy { background: #0088cc; border: none; color: white; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; display: flex; justify-content: space-around; border-top: 2px solid var(--cyan); }
        .nav-btn { color: #555; text-align: center; font-size: 10px; padding-top: 15px; flex: 1; }
        .nav-btn.active { color: var(--cyan); }
    </style>
</head>
<body>

    <div class="header">
        <div class="stat" style="color:var(--gold)">💰 <span id="h-ton">0.00</span> TON</div>
        <div class="stat" style="color:var(--silver)">⚪ <span id="h-silv">0</span> GÜMÜŞ</div>
        <div class="stat">🥚 <span id="h-egg">0</span></div>
    </div>

    <div id="s-game" class="screen active">
        <div class="nests-grid">
            <div class="nest active" id="n1" onclick="spawnEgg('n1')">🕊️</div>
            <div class="nest" id="n2">🔒</div>
            <div class="nest" id="n3">🔒</div>
            <div class="nest" id="n4">🔒</div>
        </div>
        <div class="basket-container">
            <div id="basket-val" style="margin-bottom: 5px; color: var(--cyan); font-weight: bold;">Depo: 0/50</div>
            <div class="basket">🧺</div>
            <button onclick="collect()" style="background:var(--pink); border:none; padding:12px 30px; border-radius:20px; color:white; font-weight:bold; margin-top:10px;">HASAT ET</button>
        </div>
    </div>

    <div id="s-market" class="screen">
        <h2 style="color:var(--cyan)">KUŞ MARKETİ</h2>
        <div class="card">
            <span>🦜 Yeşil Kuş (2X)</span>
            <button class="btn-buy" onclick="buyBird(2, '🦜', 'n2', 0.5)">0.5 TON</button>
        </div>
        <div class="card">
            <span>🦚 Mavi Tavus (5X)</span>
            <button class="btn-buy" onclick="buyBird(5, '🦚', 'n3', 1.5)">1.5 TON</button>
        </div>
        <div class="card">
            <span>🦉 Baykuş (10X)</span>
            <button class="btn-buy" onclick="buyBird(10, '🦉', 'n4', 3.0)">3.0 TON</button>
        </div>
        <button class="btn-buy" style="background:var(--gold); color:black; width:100%; margin-top:20px;" onclick="startAd()">📺 REKLAM İZLE (ENERJİ FULL)</button>
    </div>

    <div id="s-ref" class="screen">
        <h2 style="color:var(--cyan)">REFERANS</h2>
        <div class="card" style="flex-direction:column; gap:10px;">
            <p>Arkadaşını getir, %10 kazanç sağla!</p>
            <input id="ref-url" readonly style="width:100%; background:#000; color:var(--cyan); border:1px solid #333; padding:10px; text-align:center;">
            <button class="btn-buy" onclick="copyRef()">LİNKİ KOPYALA</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-btn active" id="n-game" onclick="show('game')">🏠<br>KÜMES</div>
        <div class="nav-btn" id="n-market" onclick="show('market')">🛒<br>MARKET</div>
        <div class="nav-btn" id="n-ref" onclick="show('ref')">👥<br>REF</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        let eggs = 0, depo = 0, silv = 0, ton = 0, mult = 1;
        let activeBirds = { n1: true, n2: false, n3: false, n4: false };

        function show(s) {
            document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
            document.getElementById('s-'+s).classList.add('active');
            document.getElementById('n-'+s).classList.add('active');
            if(s==='ref') document.getElementById('ref-url').value = "https://t.me/Gogircin_bot?start=" + tg.initDataUnsafe.user.id;
        }

        // YUMURTA FIRLATMA ANİMASYONU
        function spawnEgg(nestId) {
            if(!activeBirds[nestId] || depo >= 50) return;
            
            const nest = document.getElementById(nestId);
            const egg = document.createElement('div');
            egg.className = 'egg-anim';
            egg.innerText = '🥚';
            
            const rect = nest.getBoundingClientRect();
            egg.style.left = (rect.left + rect.width/2) + 'px';
            egg.style.top = (rect.top + rect.height/2) + 'px';
            document.body.appendChild(egg);

            setTimeout(() => {
                egg.style.left = '50%';
                egg.style.top = (window.innerHeight - 150) + 'px';
                egg.style.transform = 'scale(0.5)';
                egg.style.opacity = '0';
            }, 50);

            setTimeout(() => {
                depo++;
                egg.remove();
                updateUI();
                tg.HapticFeedback.impactOccurred('light');
            }, 600);
        }

        function updateUI() {
            document.getElementById('h-egg').innerText = Math.floor(eggs);
            document.getElementById('h-silv').innerText = Math.floor(silv);
            document.getElementById('h-ton').innerText = ton.toFixed(2);
            document.getElementById('basket-val').innerText = "Depo: " + depo + "/50";
        }

        function collect() {
            if(depo > 0) {
                eggs += depo;
                depo = 0;
                updateUI();
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        function buyBird(speed, icon, nestId, price) {
            tg.showConfirm(price + " TON ödemeyi onaylıyor musunuz?", (ok) => {
                if(ok) {
                    activeBirds[nestId] = true;
                    document.getElementById(nestId).innerText = icon;
                    document.getElementById(nestId).classList.add('active');
                    tg.showAlert("Kuş başarıyla satın alındı!");
                    show('game');
                }
            });
        }

        function copyRef() {
            let i = document.getElementById('ref-url'); i.select(); document.execCommand('copy');
            tg.showAlert("Link kopyalandı!");
        }

        // Otomatik üretim (Yumurtalar otomatik sepete akar)
        setInterval(() => {
            Object.keys(activeBirds).forEach(id => {
                if(activeBirds[id] && id !== 'n1') spawnEgg(id);
            });
        }, 3000);

    </script>
</body>
</html>
