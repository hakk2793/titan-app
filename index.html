<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin Titan Pro - Elite</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --neon: #00f2ff; --gold: #ffd700; --fire: #ff4500; --bg: #05060d; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        .header { background: #0d1117; padding: 15px; border-bottom: 2px solid var(--neon); display: flex; justify-content: space-between; }
        .ton-box { color: var(--neon); font-weight: bold; }

        /* OYUN ALANI */
        #game-area { height: 40vh; position: relative; background: radial-gradient(circle, #1a234e 0%, #05060d 100%); overflow: hidden; }
        .bird-icon { position: absolute; width: 60px; transition: 4s linear; z-index: 10; }
        .vip-effect { filter: drop-shadow(0 0 15px var(--fire)); width: 120px !important; }

        /* PANEL */
        .panel { padding: 20px; background: #11141d; border-radius: 25px 25px 0 0; margin-top: -25px; position: relative; }
        .stat { font-size: 14px; color: #888; }
        .val { color: #fff; font-weight: bold; font-size: 18px; }

        /* MARKET */
        .shop { height: 40vh; overflow-y: auto; padding: 15px; }
        .item { background: #1c1f2e; padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #333; }
        .item img { width: 50px; border-radius: 8px; }
        
        .btn { padding: 10px 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-ad { background: #ff00ff; color: white; }
        .btn-ton { background: var(--neon); color: black; }
    </style>
</head>
<body>

    <div class="header">
        <span>@GogircinAdminBot</span>
        <span class="ton-box" id="balance">0.000 TON</span>
    </div>

    <div id="game-area"></div>

    <div class="panel">
        <div style="display:flex; justify-content:space-between">
            <div><span class="stat">🥚 YUMURTA</span><br><span class="val" id="egg-val">0</span></div>
            <div><span class="stat">⚡ ENERJİ</span><br><span class="val" id="en-val">100%</span></div>
        </div>
        <button class="btn btn-ton" style="width:100%; margin-top:15px;" onclick="collect()">HASADI TOPLA & SAT</button>
    </div>

    <div class="shop">
        <div class="item">
            <img src="https://i.ibb.co/C07Bf5x/Siber-Serce.png">
            <div><b>Siber Serçe</b><br><small>Hız: 50/s</small></div>
            <button class="btn btn-ad" onclick="buy('ad', 50, 'https://i.ibb.co/C07Bf5x/Siber-Serce.png', false)">📺 REKLAM İZLE</button>
        </div>

        <div class="item" style="border-color: var(--gold)">
            <img src="https://i.ibb.co/Jz1Q1XQ/Z-mr-d-Anka.png">
            <div><b style="color:var(--gold)">ZÜMRÜDÜ ANKA</b><br><small>Hız: 50,000/s</small></div>
            <button class="btn btn-ton" onclick="buy('ton', 50000, 'https://i.ibb.co/Jz1Q1XQ/Z-mr-d-Anka.png', true)">💎 25 TON</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        let eggs = 0, energy = 100, ton = 0;
        let birds = [];

        function buy(type, rate, img, isVip) {
            if(type === 'ad') {
                tg.showAlert("Video reklam izleniyor... (Simülasyon)");
                // Burada reklam izletme kodun (AdSense vb.) devreye girecek
                addBird(rate, img, isVip);
            } else {
                tg.showConfirm("25 TON karşılığında VIP Anka alınsın mı?", (ok) => {
                    if(ok) addBird(rate, img, isVip);
                });
            }
        }

        function addBird(rate, img, isVip) {
            birds.push({rate, img, isVip});
            const el = document.createElement('img');
            el.src = img;
            el.className = `bird-icon ${isVip ? 'vip-effect' : ''}`;
            document.getElementById('game-area').appendChild(el);
            move(el);
        }

        function move(el) {
            el.style.left = Math.random()*80 + "%";
            el.style.top = Math.random()*70 + "%";
            setTimeout(() => move(el), 4000);
        }

        setInterval(() => {
            if(energy > 0 && birds.length > 0) {
                let total = birds.reduce((s, b) => s + b.rate, 0);
                eggs += (total / 3600);
                energy -= 0.05;
            }
            document.getElementById('egg-val').innerText = Math.floor(eggs);
            document.getElementById('en-val').innerText = Math.floor(energy) + "%";
            document.getElementById('balance').innerText = ton.toFixed(3) + " TON";
        }, 1000);

        function collect() {
            ton += (eggs / 100000); // Satış oranı
            eggs = 0;
            tg.showAlert("Hasat başarıyla nakde çevrildi!");
        }
    </script>
</body>
</html>
