<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --neon: #00f2ff; --fire: #ff4500; --gold: #ffd700; --bg: #05070a; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; user-select: none; }
        
        /* HEADER */
        .header { background: #0d1117; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--neon); }
        .balance { background: rgba(0, 242, 255, 0.1); border: 1px solid var(--neon); padding: 5px 12px; border-radius: 15px; font-weight: bold; color: var(--neon); font-size: 14px; }

        /* GAME AREA */
        #game-area { height: 45vh; position: relative; background: radial-gradient(circle at 50% 50%, #1a234e 0%, #05070a 100%); overflow: hidden; }
        .bird-obj { position: absolute; width: 65px; height: 65px; object-fit: contain; transition: 3s ease-in-out; z-index: 10; pointer-events: none; }
        .anka-special { width: 130px; height: 130px; filter: drop-shadow(0 0 20px var(--fire)); z-index: 20; }

        /* PANEL */
        .info-panel { background: #0d1117; padding: 20px; border-radius: 25px 25px 0 0; margin-top: -25px; position: relative; z-index: 100; border-top: 1px solid rgba(255,255,255,0.1); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid #222; }
        .stat-label { font-size: 10px; color: #888; display: block; margin-bottom: 4px; }
        .stat-value { font-weight: bold; font-size: 15px; color: #ddd; }

        /* BUTTONS */
        .btn-action { width: 100%; padding: 16px; background: var(--neon); color: #000; border: none; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,242,255,0.3); }
        .btn-action:active { transform: scale(0.96); }

        /* SHOP */
        #shop-page { display: none; padding: 15px; height: 75vh; overflow-y: auto; background: #05070a; }
        .product-card { background: #11141d; border-radius: 20px; padding: 15px; margin-bottom: 15px; border: 1px solid #222; text-align: center; }
        .product-card img { width: 100%; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; height: 140px; object-fit: cover; }
        .btn-buy { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; margin-top: 8px; }

        /* EFFECT OVERLAY */
        #anka-effect { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center; }
        .fire-glow { color: var(--fire); font-size: 28px; font-weight: 900; text-shadow: 0 0 20px var(--fire); animation: glow 1s infinite alternate; }
        @keyframes glow { from { opacity: 0.6; } to { opacity: 1; } }

        /* NAVIGATION */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #0d1117; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #222; z-index: 1000; }
        .nav-btn { color: #666; font-size: 11px; text-align: center; text-decoration: none; cursor: pointer; }
        .nav-btn.active { color: var(--neon); }
    </style>
</head>
<body>

    <div id="anka-effect">
        <div class="fire-glow">🔥 ZÜMRÜDÜ ANKA 🔥<br>EFSANE UYANDI</div>
        <img src="https://i.ibb.co/Jz1Q1XQ/Z-mr-d-Anka.png" style="width: 70%; margin-top: 30px; filter: drop-shadow(0 0 30px var(--fire));">
    </div>

    <div class="header">
        <div style="font-size: 14px; font-weight: 700;">@GogircinAdminBot</div>
        <div class="balance" id="ton-balance">0.000 TON</div>
    </div>

    <div id="page-home">
        <div id="game-area"></div>
        <div class="info-panel">
            <div class="stat-grid">
                <div class="stat-box"><span class="stat-label">🥚 DEPO</span><span class="stat-value" id="egg-count">0</span></div>
                <div class="stat-box"><span class="stat-label">⚡ ENERJİ</span><span class="stat-value" id="energy-per">100%</span></div>
            </div>
            <button class="btn-action" onclick="collectEggs()">🧺 HASADI TOPLA VE SAT</button>
        </div>
    </div>

    <div id="page-shop">
        <div class="product-card">
            <img src="https://i.ibb.co/C07Bf5x/Siber-Serce.png">
            <h3 style="margin:5px 0">Siber Serçe</h3>
            <p style="font-size:12px; color:#888">Hız: 50/s</p>
            <button class="btn-buy" style="background:#ff00ff; color:white" onclick="buyProcess(50, 'https://i.ibb.co/C07Bf5x/Siber-Serce.png', false)">📺 REKLAM İLE AL</button>
        </div>

        <div class="product-card" style="border-color: var(--gold)">
            <img src="https://i.ibb.co/Jz1Q1XQ/Z-mr-d-Anka.png">
            <h3 style="margin:5px 0; color:var(--gold)">ZÜMRÜDÜ ANKA</h3>
            <p style="font-size:12px; color:#888">Hız: 50,000/s + VIP</p>
            <button class="btn-buy" style="background:var(--fire); color:white" onclick="buyProcess(50000, 'https://i.ibb.co/Jz1Q1XQ/Z-mr-d-Anka.png', true)">💎 25 TON İLE AL</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-btn active" id="btn-home" onclick="changePage('home')">🏠<br>KÜMES</div>
        <div class="nav-btn" id="btn-shop" onclick="changePage('shop')">🛒<br>MARKET</div>
        <div class="nav-btn" onclick="tg.close()">❌<br>ÇIKIŞ</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let eggs = 0, energy = 100, ton = 0;
        let myBirds = [{img: 'https://i.ibb.co/C07Bf5x/Siber-Serce.png', power: 100, special: false}];

        function changePage(p) {
            document.getElementById('page-home').style.display = p === 'home' ? 'block' : 'none';
            document.getElementById('page-shop').style.display = p === 'shop' ? 'block' : 'none';
            document.getElementById('btn-home').classList.toggle('active', p === 'home');
            document.getElementById('btn-shop').classList.toggle('active', p === 'shop');
        }

        function spawnBirds() {
            const area = document.getElementById('game-area');
            area.innerHTML = "";
            myBirds.forEach(b => {
                const img = document.createElement('img');
                img.src = b.img;
                img.className = `bird-obj ${b.special ? 'anka-special' : ''}`;
                area.appendChild(img);
                moveObj(img);
            });
        }

        function moveObj(el) {
            const update = () => {
                el.style.left = Math.random() * 75 + "%";
                el.style.top = Math.random() * 65 + "%";
            };
            update();
            setInterval(update, 3500);
        }

        // Oyun Döngüsü
        setInterval(() => {
            if(energy > 0) {
                let totalPower = myBirds.reduce((s, b) => s + b.power, 0);
                eggs += (totalPower / 3600);
                energy -= 0.005;
            }
            document.getElementById('egg-count').innerText = Math.floor(eggs);
            document.getElementById('energy-per').innerText = Math.floor(energy) + "%";
            document.getElementById('ton-balance').innerText = ton.toFixed(3) + " TON";
        }, 1000);

        function buyProcess(pwr, imgLink, isVip) {
            if(isVip) {
                document.getElementById('anka-effect').style.display = 'flex';
                setTimeout(() => {
                    document.getElementById('anka-effect').style.display = 'none';
                    myBirds.push({img: imgLink, power: pwr, special: true});
                    spawnBirds();
                    changePage('home');
                }, 3500);
            } else {
                myBirds.push({img: imgLink, power: pwr, special: false});
                spawnBirds();
                changePage('home');
                tg.showAlert("Kuş kümese uçtu!");
            }
        }

        function collectEggs() {
            if(eggs < 1) return;
            let earn = (eggs / 80000); 
            ton += earn;
            eggs = 0;
            tg.showScanQrPopup({text: "Hasat Başarıyla TON'a Çevrildi!"}); 
            setTimeout(() => tg.closeScanQrPopup(), 2000);
        }

        spawnBirds();
    </script>
</body>
</html>
