<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin Admin Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --neon: #00f2ff; --fire: #ff4500; --bg: #0a0b14; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        
        /* HEADER */
        .header { background: #121526; padding: 15px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--neon); }
        .ton-amt { color: var(--neon); font-weight: bold; }

        /* KÜMES EKRANI */
        #sky { height: 45vh; position: relative; background: #000 url('https://i.ibb.co/30X679p/sky-bg.jpg') center/cover; overflow: hidden; }
        .bird { position: absolute; width: 60px; transition: 4s linear; z-index: 10; }
        .anka-bird { width: 120px !important; filter: drop-shadow(0 0 15px var(--fire)); }

        /* STATS */
        .stats { background: #161b2e; padding: 20px; border-radius: 25px 25px 0 0; margin-top: -25px; position: relative; }
        .btn-main { width: 100%; padding: 15px; background: var(--neon); color: #000; border: none; border-radius: 15px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 15px rgba(0,242,255,0.4); }

        /* MARKET KARTLARI (Görsel Hatası Giderildi) */
        .shop-container { padding: 15px; height: 50vh; overflow-y: auto; display: none; }
        .card { background: #1f243d; border-radius: 20px; margin-bottom: 20px; padding: 15px; border: 1px solid #333; text-align: center; }
        .card img { width: 100%; border-radius: 15px; margin-bottom: 10px; border: 2px solid #444; }
        
        /* ALT MENÜ */
        .nav { position: fixed; bottom: 0; width: 100%; background: #0a0c16; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--neon); }
        .nav-item { color: #888; font-size: 12px; cursor: pointer; }
        .nav-item.active { color: var(--neon); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight:bold">@GogircinAdminBot</div>
        <div class="ton-amt" id="gold-txt">0.000 TON</div>
    </div>

    <div id="home-screen">
        <div id="sky"></div>
        <div class="stats">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <span>🥚 DEPO: <b id="egg-txt">0</b></span>
                <span>⚡ ENERJİ: <b id="en-txt">100%</b></span>
            </div>
            <button class="btn-main" onclick="collect()">🧺 HASADI TOPLA VE NAKDE ÇEVİR</button>
        </div>
    </div>

    <div id="shop-screen" class="shop-container">
        <div class="card">
            <img src="https://i.ibb.co/C07Bf5x/Siber-Serce.png" alt="Siber Serce">
            <h3>Siber Serçe</h3>
            <p>Hız: 50/s</p>
            <button class="btn-main" style="background:#ff00ff; color:#fff" onclick="buy('ad', 50, 'https://i.ibb.co/C07Bf5x/Siber-Serce.png')">📺 REKLAMLA AL</button>
        </div>

        <div class="card" style="border-color: var(--fire)">
            <img src="https://i.ibb.co/Jz1Q1XQ/Z-mr-d-Anka.png" alt="Anka">
            <h3 style="color:var(--fire)">ZÜMRÜDÜ ANKA</h3>
            <p>Hız: 50,000/s + VIP</p>
            <button class="btn-main" style="background:var(--fire); color:#fff" onclick="buy('ton', 50000, 'https://i.ibb.co/Jz1Q1XQ/Z-mr-d-Anka.png', true)">💎 25 TON İLE AL</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="nav('home')">🏠 KÜMES</div>
        <div class="nav-item" onclick="nav('shop')">🛒 MARKET</div>
        <div class="nav-item" onclick="tg.close()">❌ ÇIKIŞ</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        let eggs = 0, energy = 100, gold = 0;
        let birds = [{img: 'https://i.ibb.co/C07Bf5x/Siber-Serce.png', rate: 100, isVip: false}];

        function nav(page) {
            document.getElementById('home-screen').style.display = page === 'home' ? 'block' : 'none';
            document.getElementById('shop-screen').style.display = page === 'shop' ? 'block' : 'none';
        }

        function initSky() {
            const sky = document.getElementById('sky');
            sky.innerHTML = "";
            birds.forEach(b => {
                const img = document.createElement('img');
                img.src = b.img;
                img.className = `bird ${b.isVip ? 'anka-bird' : ''}`;
                sky.appendChild(img);
                animate(img);
            });
        }

        function animate(el) {
            const m = () => {
                el.style.left = Math.random()*80 + "%";
                el.style.top = Math.random()*70 + "%";
            };
            m(); setInterval(m, 4000);
        }

        setInterval(() => {
            if(energy > 0) {
                let r = birds.reduce((a, b) => a + b.rate, 0);
                eggs += (r / 3600);
                energy -= 0.01;
            }
            document.getElementById('egg-txt').innerText = Math.floor(eggs);
            document.getElementById('en-txt').innerText = Math.floor(energy) + "%";
            document.getElementById('gold-txt').innerText = gold.toFixed(3) + " TON";
        }, 1000);

        function buy(type, rate, imgUrl, isVip = false) {
            tg.showConfirm("İşlem onaylansın mı?", (ok) => {
                if(ok) {
                    birds.push({img: imgUrl, rate: rate, isVip: isVip});
                    initSky();
                    nav('home');
                }
            });
        }

        function collect() {
            let gain = (eggs / 50000);
            gold += gain; eggs = 0;
            tg.showAlert("Tebrikler! " + gain.toFixed(4) + " TON kazandın.");
        }

        initSky();
    </script>
</body>
</html>
