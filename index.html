<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin Empire Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --cyan: #00f2ff; --pink: #ff00ff; --gold: #ffd700; --bg: #0a0b10; }
        body { 
            background: var(--bg); background-image: radial-gradient(circle at 50% 50%, #1a1b26 0%, #0a0b10 100%);
            color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; 
        }
        
        .header { display: flex; justify-content: space-around; padding: 15px 5px; background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--cyan); position: fixed; top: 0; width: 100%; z-index: 100; }
        .stat-box { text-align: center; font-size: 10px; }
        .stat-val { display: block; font-size: 15px; color: var(--gold); font-weight: bold; }

        .screen { display: none; height: 100vh; padding: 90px 15px 100px; box-sizing: border-box; flex-direction: column; overflow-y: auto; }
        .screen.active { display: flex; }

        /* KÜMES VE KUŞLAR */
        .nest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .nest { 
            height: 150px; background: rgba(255,255,255,0.03); border: 1px solid #333; border-radius: 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
        }
        .bird-img { font-size: 50px; animation: süzülme 3s ease-in-out infinite; cursor: pointer; }
        @keyframes süzülme { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .bird-label { font-size: 10px; color: var(--cyan); margin-top: 5px; }

        /* DEPO VE SATIŞ */
        .depo-panel { background: rgba(0,0,0,0.6); border: 1px solid #444; border-radius: 25px; padding: 15px; margin-top: auto; text-align: center; }
        .progress-bar { width: 100%; height: 12px; background: #111; border-radius: 6px; margin: 10px 0; border: 1px solid #333; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--pink)); width: 0%; transition: 0.5s; }

        /* BUTONLAR */
        .btn { background: linear-gradient(45deg, var(--cyan), #0088cc); border: none; color: #000; padding: 12px; width: 100%; border-radius: 12px; font-weight: bold; margin: 5px 0; }
        .btn-sell { background: linear-gradient(45deg, #4caf50, #2e7d32); color: white; }

        /* NAVİGASYON */
        .nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; display: flex; justify-content: space-around; border-top: 1px solid #222; }
        .nav-item { color: #555; font-size: 10px; text-align: center; padding-top: 15px; flex: 1; }
        .nav-item.active { color: var(--cyan); }
    </style>
</head>
<body>

    <div class="header">
        <div class="stat-box">🟡 ALTIN<span class="stat-val" id="h-gold">0</span></div>
        <div class="stat-box">🥚 YUMURTA<span class="stat-val" id="h-egg" style="color:var(--cyan)">0</span></div>
        <div class="stat-box">🥈 GÜMÜŞ<span class="stat-val" id="h-silver" style="color:#bdc3c7">0</span></div>
    </div>

    <div id="s-game" class="screen active">
        <div class="nest-grid" id="main-nest">
            </div>

        <div class="depo-panel">
            <div style="font-size:12px">Depo Kapasitesi (2M)</div>
            <div class="progress-bar"><div class="progress-fill" id="depo-fill"></div></div>
            <div style="font-size:14px; margin-bottom:10px;"><span id="depo-count">0</span> / 2,000,000</div>
            <button class="btn" onclick="collectToDepo()">🧺 YUMURTALARI TOPLA</button>
            <button class="btn btn-sell" onclick="sellEggs()">💰 YUMURTALARI SAT (TAKAS)</button>
        </div>
    </div>

    <div id="s-market" class="screen">
        <h2 style="color:var(--cyan)">KUŞ PAZARI</h2>
        <div id="market-list"></div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="show('game')">🏠<br>KÜMES</div>
        <div class="nav-item" onclick="show('market')">🛒<br>MARKET</div>
        <div class="nav-item" onclick="tg.showAlert('Yakında!')">👥<br>REF</div>
        <div class="nav-item" onclick="tg.showAlert('Yakında!')">👤<br>PROFİL</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        let gold=0, silver=0, eggsInDepo=0, maxDepo=2000000;
        
        const birdTypes = [
            { name: "Baby", img: "🐥", rate: 42, cost: 1000, color: "#f1c40f" },
            { name: "Green", img: "🦜", rate: 221, cost: 5000, color: "#2ecc71" },
            { name: "Yellow", img: "🐤", rate: 1160, cost: 25000, color: "#f39c12" },
            { name: "Blue", img: "🐦", rate: 6091, cost: 125000, color: "#3498db" },
            { name: "Red", img: "🏮", rate: 31979, cost: 625000, color: "#e74c3c" }
        ];

        let myBirds = [birdTypes[0]]; // Başlangıç kuşu

        function init() {
            renderNests();
            renderMarket();
            updateUI();
        }

        function renderNests() {
            const grid = document.getElementById('main-nest');
            grid.innerHTML = "";
            myBirds.forEach(b => {
                grid.innerHTML += `
                    <div class="nest">
                        <div class="bird-img" onclick="vibrate()">${b.img}</div>
                        <div class="bird-label">${b.name}</div>
                        <div style="font-size:9px; color:#999">${b.rate}/saat</div>
                    </div>`;
            });
        }

        function renderMarket() {
            const list = document.getElementById('market-list');
            birdTypes.forEach(b => {
                list.innerHTML += `
                    <div style="background:#111; padding:15px; border-radius:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border:1px solid #333">
                        <div><b>${b.img} ${b.name}</b><br><small>${b.rate} Yumurta/Saat</small></div>
                        <button class="btn" style="width:auto; padding:5px 15px;" onclick="buyBird('${b.name}')">${b.cost} Gümüş</button>
                    </div>`;
            });
        }

        function collectToDepo() {
            let totalProduced = myBirds.reduce((a, b) => a + b.rate, 0) / 10; // Örnek toplama
            eggsInDepo = Math.min(maxDepo, eggsInDepo + totalProduced);
            updateUI();
            tg.HapticFeedback.notificationOccurred('success');
        }

        function sellEggs() {
            if(eggsInDepo <= 0) return tg.showAlert("Depo boş!");
            silver += Math.floor(eggsInDepo / 100); // 100 yumurta = 1 Gümüş
            eggsInDepo = 0;
            updateUI();
            tg.showAlert("Yumurtalar satıldı! Gümüş kazanıldı.");
        }

        function updateUI() {
            document.getElementById('h-gold').innerText = gold;
            document.getElementById('h-silver').innerText = silver;
            document.getElementById('depo-count').innerText = Math.floor(eggsInDepo).toLocaleString();
            document.getElementById('depo-fill').style.width = (eggsInDepo / maxDepo * 100) + "%";
        }

        function show(s) {
            document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
            document.getElementById('s-'+s).classList.add('active');
        }

        function vibrate() { tg.HapticFeedback.impactOccurred('medium'); }

        init();
    </script>
</body>
</html>
