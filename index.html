<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TITAN NETWORK</title>
  <!-- Telegram Web App bağımlılığını güvenli olduğunda yükle -->
  <script defer id="twap-src"></script>

  <style>
    :root { --blue: #007aff; --bg: #f8f9fa; --card: #ffffff; }
    body { background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; color: #333; overflow: hidden; }

    /* Üst Bakiye Kartı */
    .header-card { background: var(--card); margin: 15px; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
    .token-info { display: flex; align-items: center; gap: 10px; }
    .token-logo { width: 40px; height: 40px; background: #eef6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }

    /* NEON REAKTÖR (Görsel) */
    .mining-area { text-align: center; margin-top: 30px; }
    .reactor {
      width: 240px; height: 240px; margin: 0 auto;
      border: 8px solid #e9f0ff; border-radius: 50%;
      position: relative; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px rgba(0,122,255,0.2);
    }
    .blades {
      width: 190px; height: 190px;
      background: conic-gradient(from 0deg, transparent 0%, var(--blue) 28%, transparent 40%, var(--blue) 70%, transparent 82%);
      border-radius: 50%;
      animation: spin 2s linear infinite;
      filter: blur(2px);
      opacity: 0.85;
    }
    .reactor-core { position: absolute; width: 68px; height: 68px; background: var(--blue); border-radius: 50%; box-shadow: 0 0 28px var(--blue); display: grid; place-items: center; color: white; font-size: 28px; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* Bakiye Yazısı */
    .balance-main { font-size: 42px; font-weight: 800; margin: 25px 0 5px 0; font-variant-numeric: tabular-nums; }
    .speed-tag { font-size: 15px; color: var(--blue); font-weight: bold; margin-bottom: 25px; }

    /* Buton */
    .btn-action { background: var(--blue); color: white; border: none; width: 90%; padding: 18px; border-radius: 18px; font-size: 18px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,122,255,0.3); cursor: pointer; }

    /* Alt Navbar */
    .nav-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; padding: 10px 0; border-top: 1px solid #eee; }
    .nav-item { flex: 1; text-align: center; font-size: 10px; color: #999; text-decoration: none; }
    .nav-item.active { color: var(--blue); }
    .nav-item b { display: block; font-size: 22px; margin-bottom: 2px; }

    /* Erişilebilirlik geliştirmeleri (opsiyonel) */
    [role="button"] { cursor: pointer; }
  </style>
</head>
<body>
  <div class="header-card" aria-label="Bakiye Bilgisi">
    <div class="token-info">
      <div class="token-logo" aria-hidden="true">💎</div>
      <div style="text-align:left;">
        <small style="color:#888;">Balance</small><br><b>0 TON</b>
      </div>
    </div>
    <button id="walletBtn" aria-label="Cüzdan" style="border:none; background:#eef6ff; color:var(--blue); border-radius:10px; padding:8px 12px;">👛</button>
  </div>

  <div class="mining-area" role="main">
    <div class="reactor" aria-label="Neon Reaktör">
      <div class="blades"></div>
      <div class="reactor-core">⚡</div>
    </div>

    <div class="balance-main" id="balance">0.00000000</div>
    <div class="speed-tag" id="speedTag">⚡ 0.012 PPH (Aktif)</div>

    <button class="btn-action" id="mineBtn" onclick="startMining()">🚀 Start Mining</button>
  </div>

  <div class="nav-bar" aria-label="Alt Navigasyon">
    <a class="nav-item"><b>👛</b>Wallet</a>
    <a class="nav-item"><b>👥</b>Friends</a>
    <a class="nav-item active"><b>🏠</b>Home</a>
    <a class="nav-item"><b>🎯</b>Missions</a>
    <a class="nav-item"><b>⚙️</b>More</a>
  </div>

  <script>
    // Durum değişkenleri
    let balance = 0.0;
    let speed = 0.012;
    let isMining = false;
    let miningInterval = null;

    // Telegram Web App entegrasyonu güvenli bir şekilde yüklenir
    (function loadTelegramWebApp() {
      const script = document.querySelector('#twap-src');
      // Güvenli yükleme: CDN veya yerel dosya ile değiştirilebilir
      const src = "https://telegram.org/js/telegram-web-app.js";

      // Basit bir dinamik yükleme
      const el = document.createElement('script');
      el.src = src;
      el.async = true;
      el.onload = () => {
        if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
          // Basit başlangıç çağrıları
          Telegram.WebApp.ready();
          Telegram.WebApp.expand();
        } else {
          console.warn("Telegram WebApp hazır değil.");
        }
      };
      el.onerror = () => {
        // Hata durumunda kullanıcıya bilgi verebilir veya fallback
        console.warn("Telegram WebApp yüklenemedi. İnternet bağlantısını kontrol edin.");
        // Basit bir fallback mesajı yoksa UI bozulmasın diye devam eder
      };
      document.head.appendChild(el);
    })();

    function startMining() {
      if (isMining) return;
      // Telegram kontrolü (mümkünse)
      const canUseTelegram = typeof Telegram !== 'undefined' && Telegram.WebApp;
      if (!canUseTelegram) {
        alert('Telegram Web App çalışmıyor. Mining işlevi devre dışı kaldı.');
      }

      isMining = true;
      // Haptic feedback (varsa)
      try {
        Telegram?.WebApp?.HapticFeedback?.impactOccurred?.('heavy');
      } catch (e) {
        // Yedek: hiçbir şey yapmadan devam et
      }

      const mineBtn = document.getElementById('mineBtn');
      mineBtn.innerText = "⛏️ Mining...";
