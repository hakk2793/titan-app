<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TITAN NETWORK</title>
  <!-- Harici bağımlılıkları güvenli şekilde yüklemek için Dinamik Yükleme -->
  <style>
    :root { --blue: #007aff; --bg: #f8f9fa; --card: #ffffff; --green: #2ecc71; }
    body { background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; padding: 0; overflow: hidden; }
    .page { display: none; height: calc(100vh - 80px); overflow-y: auto; padding: 15px; box-sizing: border-box; }
    .page.active { display: block; }

    /* Üst Panel */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .bal-box { background: white; padding: 10px 15px; border-radius: 15px; border: 1px solid #eee; font-weight: bold; }
    .save-btn { background: var(--green); color: white; border: none; padding: 10px 15px; border-radius: 12px; font-weight: bold; }

    /* Madencilik */
    .mine-card { text-align: center; margin-top: 20px; }
    .reactor { width: 160px; height: 160px; margin: 0 auto; border: 8px solid #eef6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
    .blades { width: 130px; height: 130px; background: conic-gradient(from 0deg, transparent 0%, var(--blue) 30%, transparent 40%, var(--blue) 70%, transparent 80%); border-radius: 50%; animation: rotate 2s linear infinite; }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .main-balance { font-size: 38px; font-weight: 800; margin: 20px 0; }

    /* Menü */
    .nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: white; display: flex; border-top: 1px solid #eee; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: #999; cursor: pointer; }
    .nav-item.active { color: var(--blue); font-weight: bold; }
    .nav-item span { font-size: 24px; margin-bottom: 4px; }

    #ton-connect-btn { margin: 20px 0; display: flex; justify-content: center; }
  </style>
</head>
<body>

  <!-- HOME -->
  <div id="home" class="page active" role="main">
    <div class="header">
      <div class="bal-box">💎 <span id="topBal">0.0000</span></div>
      <button class="save-btn" id="walletBtn" aria-label="Cüzdanı aç">📥 Save to Wallet</button>
    </div>

    <div id="ton-connect-btn"></div>

    <div class="mine-card" aria-label="Multiplatform Mining">
      <div class="reactor" style="margin-bottom:16px;">
        <div class="blades"></div>
      </div>
      <div class="main-balance" id="disp">0.00000000</div>
      <div style="color:var(--blue); font-weight:bold; margin-bottom:20px;">⚡ <span id="speed">0.012</span> PPH</div>
      <button id="mBtn" onclick="startMining()" style="background:var(--blue); color:white; border:none; width:100%; padding:18px; border-radius:20px; font-size:18px; font-weight:bold;">🚀 Start Mining</button>
    </div>
  </div>

  <!-- WALLET -->
  <div id="wallet" class="page" role="region" aria-label="Wallet">
    <h2 style="text-align:center;">Wallet</h2>
    <div style="background:white; padding:30px; border-radius:25px; text-align:center; border:1px solid #eee;">
      <div style="font-size:40px;">👛</div>
      <div style="font-size:32px; font-weight:800; margin:10px 0;"><span id="wBal">0.0000</span> TON</div>
    </div>
  </div>

  <!-- SHOP / PAKETLER -->
  <div id="shop" class="page" role="region" aria-label="Shop">
    <h2 style="text-align:center;">Paketler</h2>
    <div style="background:white; padding:15px; border-radius:20px; display:flex; flex-direction:column; gap:12px;">
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <div><strong>Hız Paketi Mini</strong><br/><small>Etki: +0.5x</small></div>
        <button class="save-btn" onclick="buy('mini')">2 TON</button>
      </div>
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <div><strong>Hız Paketi Pro</strong><br/><small>Etki: +1.0x</small></div>
        <button class="save-btn" onclick="buy('pro')">5 TON</button>
      </div>
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <div><strong>Hız Paketi Ultra</strong><br/><small>Etki: +1.5x</small></div>
        <button class="save-btn" onclick="buy('ultra')">8 TON</button>
      </div>
    </div>
  </div>

  <!-- LEADERS -->
  <div id="leaders" class="page" role="region" aria-label="Leaders">
    <h2 style="text-align:center;">Leaders</h2>
    <div style="background:white; padding:15px; border-radius:15px; border:1px solid #eee;">1. @king_ton - 150 TON</div>
  </div>

  <!-- Bottom Navigation -->
  <div class="nav" aria-label="Alt menü">
    <div class="nav-item active" onclick="go('home')" id="n-home"><span>🏠</span>Home</div>
    <div class="nav-item" onclick="go('wallet')" id="n-wallet"><span>👛</span>Wallet</div>
    <div class="nav-item" onclick="go('shop')" id="n-shop"><span>🚀</span>Shop</div>
    <div class="nav-item" onclick="go('leaders')" id="n-leaders"><span>🏆</span>Leaders</div>
  </div>

  <script>
    // Durumlar
    let balance = parseFloat(localStorage.getItem('balance') || '0');
    let mineBal = parseFloat(localStorage.getItem('mineBal') || '0');
    let speed = parseFloat(localStorage.getItem('speed') || '0.012');
    let isMining = false;
    let miningInterval = null;

    // UI Güncelleme
    function updateUI() {
      document.getElementById('disp').innerText = mineBal.toFixed(8);
      document.getElementById('topBal').innerText = balance.toFixed(4);
      document.getElementById('wBal').innerText = balance.toFixed(4);
      document.getElementById('speed').innerText = speed.toFixed(3);
    }

    // Miningi başlat/durdur
    function startMining() {
      if (isMining) return;
      isMining = true;
      const btn = document.getElementById('mBtn');
      btn.innerText = "⛏️ Mining...";
      btn.style.background = "#2ecc71";

      miningInterval = setInterval(() => {
        // Basit üretim simülasyonu
        mineBal += (speed / 3600);
        localStorage.setItem('mineBal', mineBal);
        updateUI();
      }, 1000);
    }

    // Cüzdan açma (Telegram entegrasyonu varsa kullan)
    document.getElementById('walletBtn').addEventListener('click', () => {
      if (typeof Telegram !== 'undefined' && Telegram.WebApp && Telegram.WebApp.openWallet) {
        Telegram.WebApp.openWallet();
      } else {
        alert('Cüzdan özelliği bu ortamda desteklenmiyor.');
      }
    });

    // Paket satın alma (basit simülasyon)
    const paketDegerleri = {
      mini: { add: 0.5, cost: 2 },
      pro: { add: 1.0, cost: 5 },
      ultra: { add: 1.5, cost: 8 }
    };

    async function buy(paketId) {
      const p = paketDegerleri[paketId];
      if (!p) {
        alert('Geçersiz paket');
        return;
      }
      const onay = confirm(`"${paketId}" paketini ${p.cost} TON karşılığında satın almak istiyor musunuz?`);
      if (!onay) return;

      // Gerçek ödeme entegrasyonu burada olmalı (sunucu tarafı doğrulama ile)
      // Başarılı sayılıyor:
      speed += p.add;
      localStorage.setItem('speed', speed);
      updateUI();
      alert(`Paket satın alındı: ${paketId} - Hız artışı ${p.add}x eklendi`);
    }

    // Navigasyon fonksiyonu
    function go(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      if (id === 'home') document.getElementById('n-home').classList.add('active');
      if (id === 'wallet') document.getElementById('n-wallet').classList.add('active');
      if (id === 'shop') document.getElementById('n-shop').classList.add('active');
      if (id === 'leaders') document.getElementById('n-leaders').classList.add('active');
    }

    // Initial değerler ve yükleme
    window.addEventListener('load', () => {
      updateUI();
      go('home');
    });

    // Telegram Web App entegrasyonu için güvenli yükleme
    (function loadTelegramWebApp() {
      const el = document.createElement('script');
      el.src = "https://telegram.org/js/telegram-web-app.js";
      el.async = true;
      el.onload = () => {
        if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
          Telegram.WebApp.ready();
          Telegram.WebApp.expand();
        }
      };
      el.onerror = () => {
        console.warn("Telegram Web App yüklenemedi. Özellikler kısıtlı olabilir.");
      };
      document.head.appendChild(el);
    })();
  </script>
</body>
</html>
