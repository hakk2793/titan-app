<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin 101 Okey</title>
    <script src="https://sad.adsgram.ai/js/adsgram-ad-sdk.js"></script>
    <style>
        body { background: #0a4d2d; color: white; font-family: Arial; margin: 0; text-align: center; }
        .table { height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .rack { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; background: #4a2c16; padding: 15px; border-radius: 10px; min-height: 100px; }
        .tile { background: #fdf5e6; color: black; width: 35px; height: 50px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .btn-play { background: #ffd700; color: #000; border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; font-size: 1.2rem; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .status { font-size: 1.1rem; margin-bottom: 10px; color: #ccffcc; }
    </style>
</head>
<body>

<div class="table">
    <div>
        <h2>🀄 Gogircin 101 Okey</h2>
        <p class="status" id="statusMsg">Taşları dağıtmak için reklamı izle!</p>
    </div>

    <div class="rack" id="gameRack">
        </div>

    <button class="btn-play" onclick="showOkeyAd()">🎬 REKLAM İZLE & DAĞIT</button>
</div>

<script>
    // Senin aldığın Block ID
    const AdController = window.Adsgram.init({ blockId: "22286" });

    function showOkeyAd() {
        document.getElementById('statusMsg').innerText = "Reklam yükleniyor...";
        
        AdController.show().then((result) => {
            // Reklam başarıyla izlendiğinde çalışır
            document.getElementById('statusMsg').innerText = "✅ Reklam izlendi! Taşlar dağıtılıyor...";
            dealOkeyTiles();
        }).catch((result) => {
            // Reklam hata verirse veya kapatılırsa
            alert("Üstadım, ödül kazanmak için reklamı sonuna kadar izlemelisin.");
            document.getElementById('statusMsg').innerText = "⚠️ Reklam izlenmedi.";
        });
    }

    function dealOkeyTiles() {
        const rack = document.getElementById('gameRack');
        rack.innerHTML = ""; // Eski taşları temizle
        const colors = ['red', 'blue', 'black', 'orange'];
        
        // 21 adet rastgele taş oluştur
        for(let i=0; i<21; i++) {
            const num = Math.floor(Math.random() * 13) + 1;
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            const tileDiv = document.createElement('div');
            tileDiv.className = 'tile';
            tileDiv.style.color = color;
            tileDiv.innerText = num;
            rack.appendChild(tileDiv);
        }
    }
</script>

</body>
</html>
