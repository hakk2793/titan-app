<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN NETWORK</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --blue: #007aff; --bg: #f8f9fa; --green: #2ecc71; }
        body { background: var(--bg); font-family: sans-serif; margin: 0; padding: 0; overflow: hidden; }
        
        /* Sayfalar */
        .page { display: none; height: 100vh; padding: 20px; box-sizing: border-box; }
        .page.active { display: block !important; }

        /* Üst Panel */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stat { background: white; padding: 10px; border-radius: 12px; border: 1px solid #ddd; font-weight: bold; }
        .claim { background: var(--green); color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; }

        /* Ana Alan */
        .main { text-align: center; }
        .circle { width: 140px; height: 140px; margin: 0 auto; border: 8px solid #eef6ff; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; }
        .spin { width: 110px; height: 110px; background: conic-gradient(from 0deg, #007aff, transparent); border-radius: 50%; animation: rot 2s linear infinite; }
        @keyframes rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* Alt Menü */
        .nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: white; display: flex; border-top: 1px solid #eee; }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #888; cursor: pointer; }
        .nav-btn.selected { color: var(--blue); font-weight: bold; }
        .nav-btn span { font-size: 24px; }

        #ton-connect-button { display: flex; justify-content: center; margin: 15px 0; }
    </style>
</head>
<body>

    <div id="pg-home" class="page active">
        <div class="header">
            <div class="stat">💎 <span id="top-w">0.0000</span></div>
            <button class="claim" onclick="doClaim()">📥 Save</button>
        </div>
        <div id="ton-connect-button"></div>
        <div class="main">
            <div class="circle"><div class="spin"></div><div style="position:absolute;">⚡</div></div>
            <div style="font-size:32px; font-weight:800; margin:15px 0;" id="m-bal">0.00000000</div>
            <p style="color:var(--blue); font-weight:bold;">⚡ 0.012 PPH</p>
            <button onclick="doStart()" id="s-btn" style="background:var(--blue); color:white; border:none; width:90%; padding:15px; border-radius:15px; font-weight:bold; font-size:18px;">🚀 Start Mining</button>
        </div>
    </div>

    <div id="pg-wallet" class="page">
        <h2 style="text-align:center;">Cüzdanın</h2>
        <div class="stat" style="text-align:center; padding:30px; font-size:24px;">
            <span id="w-bal">0.0000</span> TON
        </div>
    </div>

    <div id="pg-shop" class="page">
        <h2 style="text-align:center;">Market</h2>
        <div class="stat">Hız Paketi: 2 TON</div>
    </div>

    <div id="pg-leaders" class="page">
        <h2 style="text-align:center;">Liderler</h2>
        <div class="stat">1. @titan_king</div>
    </div>

    <div class="nav">
        <div class="nav-btn selected" onclick="go('home')" id="b-home"><span>🏠</span>Home</div>
        <div class="nav-btn" onclick="go('wallet')" id="b-wallet"><span>👛</span>Wallet</div>
        <div class="nav-btn" onclick="go('shop')" id="b-shop"><span>🚀</span>Shop</div>
        <div class="nav-btn" onclick="go('leaders')" id="b-leaders"><span>🏆</span>Leaders</div>
    </div>

    <script>
        // Manifest URL'sini kontrol et!
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://hakk2793.github.io/titan-uygulamasi/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        let mb = parseFloat(localStorage.getItem('mb')) || 0;
        let wb = parseFloat(localStorage.getItem('wb')) || 0;
        let isM = localStorage.getItem('isM') === 'true';

        // Sayfa Değiştirme (Kesin Çözüm)
        function go(p) {
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('selected'));
            document.getElementById('pg-' + p).classList.add('active');
            document.getElementById('b-' + p).classList.add('selected');
        }

        function doStart() {
            if(isM) return;
            isM = true; localStorage.setItem('isM', 'true');
            document.getElementById('s-btn').innerText = "Mining...";
            setInterval(() => {
                mb += (0.012 / 3600);
                document.getElementById('m-bal').innerText = mb.toFixed(8);
                localStorage.setItem('mb', mb);
            }, 1000);
        }

        function doClaim() {
            wb += mb; mb = 0;
            localStorage.setItem('wb', wb); localStorage.setItem('mb', 0);
            update();
            Telegram.WebApp.showAlert("Kaydedildi!");
        }

        function update() {
            document.getElementById('m-bal').innerText = mb.toFixed(8);
            document.getElementById('top-w').innerText = wb.toFixed(4);
            document.getElementById('w-bal').innerText = wb.toFixed(4);
        }

        window.onload = () => { if(isM) doStart(); update(); };
        Telegram.WebApp.ready();
    </script>
</body>
</html>
