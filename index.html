<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin Pro - AdEngine</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --n-cyan: #00f2ff; --n-pink: #ff00ff; --bg: #050505; --gold: #ffd700; --silver: #e0e0e0; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
        .header { padding: 10px; display: flex; justify-content: space-around; border-bottom: 1px solid var(--n-cyan); background: rgba(0,242,255,0.05); font-size: 11px; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; padding: 20px; }
        .screen.active { display: flex; }
        .bird { font-size: 100px; filter: drop-shadow(0 0 15px var(--n-pink)); cursor: pointer; }
        
        /* Enerji Barı */
        .stat-wrap { width: 85%; margin: 10px 0; }
        .bar-bg { width: 100%; height: 8px; background: #222; border-radius: 4px; overflow: hidden; border: 1px solid #333; }
        .bar-fill-energy { height: 100%; background: linear-gradient(90deg, #ff0000, #00ff00); transition: width 0.3s; }
        .bar-fill-egg { height: 100%; background: linear-gradient(90deg, var(--n-cyan), var(--n-pink)); }

        .btn-main { background: linear-gradient(45deg, var(--n-pink), #800080); border: none; color: white; padding: 12px 30px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 85%; margin: 5px; }
        .btn-ad { background: linear-gradient(45deg, #ffd700, #b8860b); color: black !important; }

        /* Video Overlay */
        #video-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="video-overlay">
        <h3 style="color:yellow">📺 REKLAM İZLENİYOR...</h3>
        <div style="font-size: 40px;" id="ad-timer">15</div>
        <p>Enerji doluyor ve üretim 10X hızlanıyor!</p>
    </div>

    <div class="header">
        <div style="color:var(--gold)">🟡 ALTIN: <span id="h-gold">0</span></div>
        <div style="color:var(--silver)">⚪ GÜMÜŞ: <span id="h-silv">0</span></div>
    </div>

    <div id="s-game" class="screen active">
        <div class="bird" id="main-bird">🕊️</div>
        
        <div class="stat-wrap">
            <div style="font-size:10px; color:#00ff00">ENERJİ: <span id="energy-val">100/100</span></div>
            <div class="bar-bg"><div class="bar-fill-energy" id="energy-bar" style="width:100%"></div></div>
        </div>

        <div class="stat-wrap">
            <div style="font-size:10px; color:var(--n-cyan)">SEPET: <span id="egg-val">0/20</span></div>
            <div class="bar-bg"><div class="bar-fill-egg" id="egg-bar" style="width:0%"></div></div>
        </div>

        <button class="btn-main" onclick="collect()">HASAT ET (-10 Enerji)</button>
        <button class="btn-main btn-ad" onclick="startAd()">📺 REKLAM İZLE (FULL ENERJİ + 10X)</button>
    </div>

    <div id="s-pazar" class="screen">
        <h3 style="color:var(--n-cyan)">TAKAS</h3>
        <p>Depodaki Yumurta: <span id="saved-eggs">0</span></p>
        <button class="btn-main" onclick="confirmTrade()">YUMURTALARI SAT</button>
    </div>

    <div class="nav-bar" style="position:fixed; bottom:0; width:100%; display:flex; justify-content:space-around; background:#111; padding:15px; border-top:1px solid var(--n-cyan);">
        <div onclick="show('game')">🏠</div>
        <div onclick="show('pazar')">🔄</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        let curE = 0, savE = 0, gold = 0, silv = 0, energy = 100, mult = 1;

        function show(s) {
            document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
            document.getElementById('s-'+s).classList.add('active');
            updateUI();
        }

        // OTOMATİK ÜRETİM (Sadece enerji varsa çalışır)
        setInterval(() => { 
            if(energy > 0 && curE < 20) { 
                curE += (0.02 * mult); 
                energy -= 0.05; // Üretirken enerji harcar
                updateUI(); 
            } 
        }, 1000);

        function updateUI() {
            document.getElementById('h-gold').innerText = Math.floor(gold);
            document.getElementById('h-silv').innerText = Math.floor(silv);
            document.getElementById('energy-val').innerText = Math.max(0, Math.floor(energy)) + "/100";
            document.getElementById('energy-bar').style.width = energy + "%";
            document.getElementById('egg-val').innerText = Math.floor(curE) + "/20";
            document.getElementById('egg-bar').style.width = (curE/20*100) + "%";
            document.getElementById('saved-eggs').innerText = Math.floor(savE);
        }

        function collect() {
            if(energy >= 10 && curE >= 1) {
                savE += Math.floor(curE);
                curE = 0;
                energy -= 10;
                updateUI();
                tg.HapticFeedback.notificationOccurred('success');
            } else if(energy < 10) {
                tg.showAlert("Enerjin bitti! Reklam izleyerek doldur.");
            }
        }

        function startAd() {
            let overlay = document.getElementById('video-overlay');
            let timerEl = document.getElementById('ad-timer');
            let timeLeft = 15;
            overlay.style.display = 'flex';
            mult = 20; // Reklam sırasında aşırı hızlı üretim

            let itv = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(itv);
                    overlay.style.display = 'none';
                    mult = 1;
                    energy = 100; // Enerji fullenir
                    updateUI();
                    tg.showAlert("Enerji dolduruldu! Üretim devam ediyor.");
                }
            }, 1000);
        }

        function confirmTrade() {
            let coins = Math.floor(savE / 100);
            if(coins >= 1) { gold += coins/2; silv += coins/2; savE %= 100; updateUI(); }
        }
    </script>
</body>
</html>
