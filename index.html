<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin Admin Bot - Anka Elite</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --neon: #00f2ff; --gold: #ffd700; --fire: #ff4500; --bg: #0a0b14; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* HEADER & STATUS */
        .header { background: rgba(255,255,255,0.03); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,242,255,0.2); }
        .ton-badge { background: linear-gradient(90deg, #0088cc, #00f2ff); padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }

        /* SKY & ANIMATION */
        #sky { height: 40vh; position: relative; overflow: hidden; background: radial-gradient(circle at center, #1c234a 0%, #0a0b14 100%); }
        .bird { position: absolute; transition: 4s linear; z-index: 10; font-size: 40px; }
        .anka-bird { font-size: 80px !important; filter: drop-shadow(0 0 20px var(--fire)); z-index: 20; }

        /* SHOP GRID (AI TASARIM) */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; height: 45vh; overflow-y: auto; }
        .bird-card { background: #161b2e; border-radius: 15px; border: 1px solid #252a41; padding: 10px; text-align: center; transition: 0.3s; }
        .bird-card img { width: 100%; border-radius: 10px; margin-bottom: 10px; height: 80px; object-fit: cover; }
        .bird-card h4 { margin: 5px 0; font-size: 14px; }
        .bird-card p { font-size: 11px; color: #888; margin: 5px 0; }

        /* BUTTONS */
        .btn { width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-buy { background: var(--neon); color: #000; margin-bottom: 5px; }
        .btn-ad { background: #ff00ff; color: white; }

        /* ANKA SATIN ALMA EFEKTİ */
        #anka-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; align-items: center; justify-content: center; flex-direction: column; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .fire-text { font-size: 30px; font-weight: bold; color: var(--fire); text-shadow: 0 0 20px var(--fire); text-align: center; }

        /* NAV BAR */
        .nav { position: fixed; bottom: 0; width: 100%; background: #0f1221; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--neon); }
    </style>
</head>
<body>

    <div id="anka-overlay">
        <div class="fire-text">🔥 EFSANE DOĞDU! 🔥<br>ZÜMRÜDÜ ANKA SİZİNLE</div>
        <img src="https://i.ibb.co/Jz1Q1XQ/Z-mr-d-Anka.png" style="width: 80%; margin-top: 20px; filter: drop-shadow(0 0 30px var(--fire));">
    </div>

    <div class="header">
        <div style="font-weight:bold; color:var(--neon)">@GogircinAdminBot</div>
        <div class="ton-badge" id="gold-txt">0.00 TON</div>
    </div>

    <div id="home" class="screen">
        <div id="sky"></div>
        <div style="padding: 15px; background: #0f1221; border-radius: 20px 20px 0 0; margin-top: -20px; position: relative;">
            <div style="display:flex; justify-content:space-between; margin-bottom: 15px;">
                <span>🥚 DEPO: <b id="egg-txt">0</b></span>
                <span>⚡ ENERJİ: <b id="en-txt">100%</b></span>
            </div>
            <button class="btn btn-buy" style="height: 50px; font-size: 16px;" onclick="collect()">🧺 HASADI TOPLA VE NAKDE ÇEVİR</button>
        </div>
    </div>

    <div id="shop" class="screen" style="display:none">
        <div class="shop-grid">
            <div class="bird-card">
                <img src="https://i.ibb.co/C07Bf5x/Siber-Serce.png">
                <h4>Siber Serçe</h4>
                <p>Hız: 50/s</p>
                <button class="btn btn-ad" onclick="buy('ad', 50, '🐦')">📺 REKLAMLA AL</button>
            </div>
            <div class="bird-card" style="border-color: var(--fire); grid-column: span 2;">
                <img src="https://i.ibb.co/Jz1Q1XQ/Z-mr-d-Anka.png" style="height: 150px;">
                <h4 style="color:var(--fire)">ZÜMRÜDÜ ANKA</h4>
                <p>Hız: 50,000/s + VIP STATÜSÜ</p>
                <button class="btn btn-buy" style="background:var(--fire); color:white" onclick="buy('ton', 50000, '🔥')">💎 25 TON İLE SATIN AL</button>
                <button class="btn btn-ad" onclick="buy('anka_ad', 50000, '🔥')">📺 150 REKLAMLA AL</button>
            </div>
        </div>
    </div>

    <div class="nav">
        <div onclick="toggle('home')">🏠 KÜMES</div>
        <div onclick="toggle('shop')">🛒 MARKET</div>
        <div onclick="tg.close()">❌ ÇIKIŞ</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        let eggs = 0, energy = 100, gold = 0;
        let birds = [{img: "🐦", rate: 100, isAnka: false}];

        function toggle(id) {
            document.getElementById('home').style.display = id === 'home' ? 'block' : 'none';
            document.getElementById('shop').style.display = id === 'shop' ? 'block' : 'none';
        }

        function initSky() {
            const sky = document.getElementById('sky');
            sky.innerHTML = "";
            birds.forEach(b => {
                const d = document.createElement('div');
                d.className = `bird ${b.isAnka ? 'anka-bird' : ''}`;
                d.innerText = b.img;
                sky.appendChild(d);
                animate(d);
            });
        }

        function animate(el) {
            const m = () => { el.style.left = Math.random()*80+"%"; el.style.top = Math.random()*70+"%"; };
            m(); setInterval(m, 4000);
        }

        setInterval(() => {
            if(energy > 0) {
                let r = birds.reduce((a, b) => a + b.rate, 0);
                eggs += (r / 3600);
                energy -= 0.01;
            }
            document.getElementById('egg-txt').innerText = Math.floor(eggs);
            document.getElementById('en-txt').innerText = Math.floor(energy) + "%";
            document.getElementById('gold-txt').innerText = gold.toFixed(3) + " TON";
        }, 1000);

        function buy(type, rate, img) {
            if(type === 'ton' || type === 'anka_ad') {
                // ANKA EFEKTİ
                document.getElementById('anka-overlay').style.display = 'flex';
                setTimeout(() => {
                    document.getElementById('anka-overlay').style.display = 'none';
                    birds.push({img: img, rate: rate, isAnka: true});
                    initSky();
                }, 3000);
            } else {
                birds.push({img: img, rate: rate, isAnka: false});
                initSky();
                tg.showAlert("Kuş eklendi!");
            }
        }

        function collect() {
            let gain = (eggs / 50000);
            gold += gain; eggs = 0;
            tg.showAlert("Hasat toplandı! " + gain.toFixed(4) + " TON kazandın.");
        }

        initSky();
    </script>
</body>
</html>
