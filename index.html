‎<!DOCTYPE html>
‎<html lang="tr">
‎<head>
‎    <meta charset="UTF-8">
‎    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
‎    <title>TITAN EMPIRE</title>
‎    <script src="https://telegram.org/js/telegram-web-app.js"></script>
‎    <style>
‎        :root { --main-bg: #0a0e14; --neon-blue: #00d2ff; --titan-gold: #ffaa00; }
‎        body { background: var(--main-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; text-align: center; overflow: hidden; }
‎        
‎        /* Üst Panel: Bakiye */
‎        .header { background: rgba(255,255,255,0.05); margin: 15px; padding: 20px; border-radius: 20px; border: 1px solid rgba(0,210,255,0.3); }
‎        .balance { font-size: 2.5rem; font-weight: bold; color: var(--neon-blue); margin: 5px 0; }
‎        
‎        /* PLAZMA REAKTÖRÜ (Dönen Fan Yerine) */
‎        .reactor-container { position: relative; width: 250px; height: 250px; margin: 30px auto; }
‎        .reactor { 
‎            width: 100%; height: 100%; 
‎            border: 8px solid #1a1a1a; border-radius: 50%;
‎            background: radial-gradient(circle, #004466 0%, #0a0e14 70%);
‎            box-shadow: 0 0 50px rgba(0,210,255,0.5);
‎            animation: rotate 3s linear infinite; /* Sürekli Dönüş */
‎        }
‎        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
‎        
‎        /* Alt Menü: Navigasyon */
‎        .navbar { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #161b22; padding: 15px 0; border-top: 1px solid #30363d; }
‎        .nav-item { color: #8b949e; font-size: 12px; cursor: pointer; transition: 0.3s; }
‎        .nav-item.active { color: var(--neon-blue); transform: scale(1.1); }
‎
‎        .btn-start { background: linear-gradient(90deg, #00d2ff, #3a7bd5); border: none; padding: 15px 50px; border-radius: 30px; color: white; font-weight: bold; font-size: 18px; margin-top: 20px; box-shadow: 0 10px 20px rgba(0,210,255,0.3); }
‎    </style>
‎</head>
‎<body>
‎
‎    <div class="header">
‎        <div style="font-size: 14px; color: #8b949e;">TOPLAM TITAN BAKİYESİ</div>
‎        <div class="balance" id="balance">0.00000</div>
‎        <div style="color: var(--titan-gold); font-size: 14px;">⚡ Hız: <span id="speed">0.0001</span> TON/saat</div>
‎    </div>
‎
‎    <div class="reactor-container">
‎        <div class="reactor"></div>
‎        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px;">💎</div>
‎    </div>
‎
‎    <button class="btn-start" onclick="startMining()">MADENCİLİĞİ BAŞLAT</button>
‎
‎    <div class="navbar">
‎        <div class="nav-item">🏠<br>Üs</div>
‎        <div class="nav-item">🛒<br>Market</div>
‎        <div class="nav-item active">⚙️<br>Merkez</div>
‎        <div class="nav-item">👥<br>Ekip</div>
‎        <div class="nav-item">👛<br>Cüzdan</div>
‎    </div>
‎
‎    <script>
‎        let bal = 0.00000;
‎        let speed = 0.00012; // Senin PPH değerin
‎
‎        function startMining() {
‎            Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
‎            setInterval(() => {
‎                bal += speed / 3600;
‎                document.getElementById('balance').innerText = bal.toFixed(8);
‎            }, 1000);
‎        }
‎        
‎        // Uygulama Ayarları
‎        Telegram.WebApp.ready();
‎        Telegram.WebApp.expand();
‎    </script>
‎</body>
‎</html>
