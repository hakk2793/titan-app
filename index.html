<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOGIRCIN TITAN PRO</title>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --blue: #00d2ff; --bg: #020617; --card: rgba(15, 23, 42, 0.8); --text: #f8fafc; --green: #10b981; --gold: #fbbf24; --neon: 0 0 15px rgba(0, 210, 255, 0.5); }
        body { background: var(--bg) url('https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=2000') no-repeat center center fixed; background-size: cover; color: var(--text); font-family: sans-serif; margin: 0; padding: 0; overflow: hidden; }
        .page { display: none; height: 100vh; padding: 20px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; backdrop-filter: blur(20px); background: rgba(2, 6, 23, 0.7); }
        .page.active { display: block !important; }
        .card { background: var(--card); border-radius: 20px; padding: 25px; margin-bottom: 15px; border: 1px solid rgba(0, 210, 255, 0.2); text-align: center; box-shadow: var(--neon); position: relative; }
        .btn { background: linear-gradient(90deg, #00d2ff, #3a86ff); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 800; width: 100%; cursor: pointer; text-transform: uppercase; }
        .btn:disabled { background: #475569; box-shadow: none; cursor: not-allowed; }
        .navbar { position: fixed; bottom: 0; width: 100%; height: 80px; background: rgba(15, 23, 42, 0.95); display: flex; border-top: 1px solid var(--blue); z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: #64748b; }
        .nav-item.active { color: var(--blue); text-shadow: var(--neon); }
        .task-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(0,210,255,0.1); }
    </style>
</head>
<body>

    <div id="p-home" class="page active">
        <div class="card" style="display:flex; justify-content: space-between; align-items:center;">
            <div><small>CÜZDAN</small><br><b id="top-bal" style="color:var(--blue)">0.0000</b></div>
            <button class="btn" style="width:auto; background:var(--green);" onclick="claim()">TOPLA</button>
        </div>
        <div class="card">
            <div style="font-size: 50px;">⚡</div>
            <div style="font-size: 36px; font-weight: 900;" id="m-bal">0.00000000</div>
            <p id="pph-text" style="color:var(--blue)">⚡ 0.512 PPH</p>
            <button id="start-btn" class="btn" onclick="startMining()">MADENCİLİĞİ BAŞLAT</button>
        </div>
    </div>

    <div id="p-tasks" class="page">
        <h2 style="text-align:center; color:var(--blue)">GÖREV MERKEZİ</h2>
        <div class="card">
            <div class="task-row">
                <div style="text-align:left;"><b>Kanala Katıl</b><br><small style="color:var(--gold)">+1.0000 TON</small></div>
                <button id="t1-btn" class="btn" style="width:80px; font-size:12px;" onclick="doTask('t1', 'https://t.me/GogircinOfficial', 1.0)">KATIL</button>
            </div>
            <div class="task-row">
                <div style="text-align:left;"><b>5 Arkadaş Davet Et</b><br><small style="color:var(--gold)">+2.5000 TON</small></div>
                <button class="btn" style="width:80px; font-size:12px;" onclick="go('rank')">DAVET ET</button>
            </div>
        </div>
    </div>

    <div id="p-game" class="page"><div class="card"><h2>TIKLA KAZAN</h2><h1 id="game-bal" style="color:var(--blue)">0.00</h1><img src="https://cdn-icons-png.flaticon.com/512/3514/3514104.png" style="width:120px;" onclick="tapGame()"></div></div>
    <div id="p-rank" class="page"><div class="card"><h2>LİDERLER</h2><button class="btn" onclick="copyRef()">REF LİNKİNİ KOPYALA</button></div></div>
    <div id="p-shop" class="page"><div class="card"><h2>MARKET</h2><button class="btn" onclick="buySpeed(1.9, 0.5)">V1 - 1.9 TON</button></div></div>

    <div class="navbar">
        <div class="nav-item active" onclick="go('home')" id="n-home"><span>📡</span>ANA ÜS</div>
        <div class="nav-item" onclick="go('tasks')" id="n-tasks"><span>📋</span>GÖREVLER</div>
        <div class="nav-item" onclick="go('game')" id="n-game"><span>🎮</span>OYUN</div>
        <div class="nav-item" onclick="go('shop')" id="n-shop"><span>🚀</span>MARKET</div>
        <div class="nav-item" onclick="go('rank')" id="n-rank"><span>🏆</span>SIRALAMA</div>
    </div>

    <script>
        let wBal = parseFloat(localStorage.getItem('wBal')) || 0.05;
        let mBal = parseFloat(localStorage.getItem('mBal')) || 0;
        let pph = parseFloat(localStorage.getItem('pph')) || 0.512;
        let isMining = localStorage.getItem('isMining') === 'true';

        function go(p) {
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
            document.getElementById('p-'+p).classList.add('active');
            document.getElementById('n-'+p).classList.add('active');
        }

        function doTask(id, link, reward) {
            if(localStorage.getItem(id)) return;
            window.open(link, '_blank');
            setTimeout(() => {
                wBal += reward;
                localStorage.setItem(id, 'done');
                document.getElementById(id+'-btn').innerText = "ALINDI";
                document.getElementById(id+'-btn').disabled = true;
                update();
                Telegram.WebApp.showAlert("GÖREV TAMAMLANDI: +" + reward + " TON HESABINIZA EKLENDİ");
            }, 5000);
        }

        function tapGame() { wBal += 0.0002; update(); }
        function startMining() { if(isMining) return; isMining = true; localStorage.setItem('isMining', 'true'); setInterval(() => { mBal += (pph/3600); update(); }, 1000); }
        function claim() { wBal += mBal; mBal = 0; update(); }
        function update() {
            document.getElementById('top-bal').innerText = wBal.toFixed(4);
            document.getElementById('m-bal').innerText = mBal.toFixed(8);
            document.getElementById('game-bal').innerText = wBal.toFixed(4);
            localStorage.setItem('wBal', wBal);
            localStorage.setItem('mBal', mBal);
        }
        
        window.onload = () => { 
            if(localStorage.getItem('t1')) { document.getElementById('t1-btn').innerText = "ALINDI"; document.getElementById('t1-btn').disabled = true; }
            if(isMining) { isMining=false; startMining(); } 
            update(); 
        };
    </script>
</body>
</html>
