<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN NETWORK</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --blue: #007aff; --bg: #f8f9fa; --card: #ffffff; --green: #2ecc71; --gold: #f1c40f; }
        body { background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; padding: 0; color: #333; overflow: hidden; }
        
        /* Sayfa Yapısı */
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 100px; box-sizing: border-box; }
        .page.active { display: block; }
        
        /* Kart Tasarımları */
        .header-card { background: var(--card); margin: 15px; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .token-logo { width: 40px; height: 40px; background: #eef6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        /* Reaktör Bölümü */
        .mining-area { text-align: center; margin-top: 10px; }
        .reactor { width: 180px; height: 180px; margin: 0 auto; border: 8px solid #eef6ff; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,122,255,0.2); }
        .blades { width: 140px; height: 140px; background: conic-gradient(from 0deg, transparent 0%, var(--blue) 30%, transparent 40%, var(--blue) 70%, transparent 80%); border-radius: 50%; animation: spin 2s linear infinite; filter: blur(2px); opacity: 0.8; }
        .reactor-core { position: absolute; width: 40px; height: 40px; background: var(--blue); border-radius: 50%; box-shadow: 0 0 30px var(--blue); color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .balance-main { font-size: 36px; font-weight: 800; margin: 15px 0 5px 0; font-variant-numeric: tabular-nums; }
