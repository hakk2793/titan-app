<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN NETWORK</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Örnekteki TONIX Stilini Buraya Kodladım */
        :root { --blue: #007aff; --bg: #f8f9fa; --card: #ffffff; }
        body { background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; color: #333; overflow: hidden; }
        
        /* Üst Bakiye Kartı */
        .header-card { background: var(--card); margin: 15px; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .token-info { display: flex; align-items: center; gap: 10px; }
        .token-logo { width: 40px; height: 40px; background: #eef6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        /* Ana Alan ve Fan */
        .mining-area { text-align: center; margin-top: 40px; }
        .fan-container { width: 260px; height: 260px; margin: 0 auto; position: relative; }
        .fan-img { width: 100%; height: 100%; animation: spin 4s linear infinite; filter: drop-shadow(0 0 20px rgba(0,122,255,0.2)); }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Bakiye Yazısı */
        .balance-main { font-size: 36px; font-weight: 800; margin: 20px 0 5px 0; font-variant-numeric: tabular-nums; }
        .speed-tag { font-size: 14px; color: #888; margin-bottom: 25px; }

        /* Mavi Buton */
        .btn-action { background: var(--blue); color: white; border: none; width: 90%; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,122,255,0.3); }

        /* Alt Navbar: Tam Örnekteki Gibi */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; padding: 12px 0; border-top: 1px solid #eee; }
        .nav-item { flex: 1; text-align: center; font-size: 11px; color: #999; }
        .nav-item.active { color: var(--blue); }
        .nav-item b { display: block; font-size: 24px; margin-bottom: 3px; }
    </style>
</head>
<body>
    <div class="header-card">
        <div class="token-info">
            <div class="token-logo">💎</div>
            <div style="text-align:left;"><small style="color:#888;">Balance</small><br><b>0 TON</b></div>
        </div>
        <button style="border:none; background:#eef6ff; color:var(--blue); border-radius:10px; padding:8px 12px;">👛</button>
    </div>

    <div class="mining-area">
        <div class="fan-container">
            <img src="https://cdn-icons-png.flaticon.com/512/9334/9334346.png" class="fan-img">
        </div>

        <div class="balance-main" id="balance">0.00000000</div>
        <div class="speed-tag">⚡ 0.00012 PPH</div>

        <button class="btn-action" onclick="startMining()">🚀 Start Mining</button>
    </div>

    <div class="nav-bar">
        <div class="nav-item"><b>👛</b>Wallet</div>
        <div class="nav-item"><b>👥</b>Friends</div>
        <div class="nav-item active"><b>🏠</b>Home</div>
        <div class="nav-item"><b>🎯</b>Missions</div>
        <div class="nav-item"><b>⚙️</b>More</div>
    </div>

    <script>
        let balance = 0.00000000;
        let speed = 0.00012;
        let isMining = false;

        function startMining() {
            if(isMining) return;
            isMining = true;
            Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
            
            setInterval(() => {
                balance += (speed / 3600);
                document.getElementById('balance').innerText = balance.toFixed(8);
            }, 1000);
        }
    </script>
</body>
</html>
