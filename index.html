<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin Titan Pro - Full</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ff; --gold: #ffd700; --bg: #03040a; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* EKRAN YÖNETİMİ */
        .screen { display: none; height: 100vh; width: 100vw; position: absolute; }
        .active { display: block; }

        /* GÖKYÜZÜ VE KUŞLAR */
        #sky { height: 60%; position: relative; background: radial-gradient(circle, #0e1121 0%, #03040a 100%); overflow: hidden; }
        .bird { position: absolute; font-size: 50px; transition: 4s linear; z-index: 10; filter: drop-shadow(0 0 10px var(--neon)); }
        .vip { filter: drop-shadow(0 0 20px var(--gold)); font-size: 70px; }

        /* ALT PANEL VE MENÜ */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #0a0c16; display: flex; justify-content: space-around; padding: 15px 0; border-top: 2px solid var(--neon); z-index: 1000; }
        .nav-item { color: #555; font-size: 12px; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--neon); font-weight: bold; }

        /* MAĞAZA VE REFERANS KARTLARI */
        .card { background: #121526; margin: 15px; padding: 20px; border-radius: 20px; border: 1px solid rgba(0,242,255,0.1); }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-ton { background: #0088cc; color: white; }
        .btn-ad { background: var(--pink); color: white; }

        /* RESUL OVERLAY */
        #resul-ui { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="resul-ui">
        <h2 style="color:var(--pink)">🕒 RESUL ZAMANI!</h2>
        <p>Kuşların acıktı, üretim durdu.</p>
        <button class="btn btn-ad" style="width: 70%" onclick="feed()">📺 REKLAM İZLE VE YEMLE</button>
    </div>

    <div id="home" class="screen active">
        <div id="sky"></div>
        <div class="card" style="margin-top:-20px; position:relative; z-index:100;">
            <div style="display:flex; justify-content:space-between">
                <span>⚡ ENERJİ: <span id="en-txt">100%</span></span>
                <span>🥚 DEPO: <span id="egg-txt">0</span></span>
            </div>
            <button class="btn" style="background:var(--neon); color:#000" onclick="collect()">🧺 HASADI TOPLA</button>
        </div>
    </div>

    <div id="shop" class="screen">
        <h2 style="text-align:center; padding-top:20px; color:var(--neon)">KUŞ PAZARI</h2>
        <div class="card">
            <h3>🐥 SARI KANAT</h3>
            <p>Hız: 42/Saat</p>
            <button class="btn btn-ad" onclick="buyBird('ad')">📺 REKLAMLA AL (ÜCRETSİZ)</button>
        </div>
        <div class="card" style="border-color: var(--gold)">
            <h3 style="color:var(--gold)">🔥 KIZIL HAN (VIP)</h3>
            <p>Hız: 31,979/Saat</p>
            <button class="btn btn-ton" onclick="buyBird('ton')">💎 1 TON İLE SATIN AL</button>
        </div>
    </div>

    <div id="ref" class="screen">
        <h2 style="text-align:center; padding-top:20px; color:var(--neon)">REFERANS SİSTEMİ</h2>
        <div class="card" style="text-align:center">
            <p>Davet ettiğin her arkadaşın için <b>500 Gümüş</b> kazan!</p>
            <input type="text" value="https://t.me/Gogircin_bot?start=12345" readonly style="width:100%; background:#05060a; color:var(--neon); border:1px solid #333; padding:10px; border-radius:5px; text-align:center">
            <button class="btn" style="background:var(--gold); color:#000" onclick="copyRef()">🔗 LİNKİ KOPYALA</button>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="show('home')">🏠 KÜMES</div>
        <div class="nav-item" onclick="show('shop')">🛒 MARKET</div>
        <div class="nav-item" onclick="show('ref')">👥 REF</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        let eggs = 0, energy = 100, birds = [{img: "🐦", isVip: false, rate: 100}];

        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function initBirds() {
            const sky = document.getElementById('sky');
            sky.innerHTML = "";
            birds.forEach((b, i) => {
                const d = document.createElement('div');
                d.className = `bird ${b.isVip ? 'vip' : ''}`;
                d.innerText = b.img;
                sky.appendChild(d);
                move(d);
            });
        }

        function move(el) {
            if(energy <= 0) return;
            el.style.left = Math.random()*80 + "%";
            el.style.top = Math.random()*70 + "%";
            setTimeout(() => move(el), 4000);
        }

        setInterval(() => {
            if(energy > 0) {
                let total = birds.reduce((a,b) => a + b.rate, 0);
                eggs += (total/3600);
                energy -= 0.1;
                if(energy <= 0) document.getElementById('resul-ui').style.display = 'flex';
            }
            document.getElementById('egg-txt').innerText = Math.floor(eggs);
            document.getElementById('en-txt').innerText = Math.floor(energy) + "%";
        }, 1000);

        function buyBird(type) {
            if(type === 'ad') {
                tg.showConfirm("Reklam izleyerek kuş almak istiyor musun?", (ok) => {
                    if(ok) { birds.push({img: "🐥", isVip: false, rate: 42}); initBirds(); tg.showAlert("Kuş eklendi!"); }
                });
            } else {
                tg.showAlert("TON ödeme sayfasına yönlendiriliyorsunuz...");
                // Buraya TonConnect entegrasyonu gelecek
                birds.push({img: "🔥", isVip: true, rate: 31979}); initBirds();
            }
        }

        function feed() { energy = 100; document.getElementById('resul-ui').style.display = 'none'; initBirds(); }
        function collect() { tg.showAlert(Math.floor(eggs) + " toplandı!"); eggs = 0; }
        function copyRef() { tg.showAlert("Link kopyalandı!"); }

        initBirds();
    </script>
</body>
</html>
