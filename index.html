<style>
    /* Liderlik Tablosu Tasarımı */
    .leader-item { 
        background: white; margin: 10px 15px; padding: 15px; border-radius: 20px; 
        display: flex; align-items: center; justify-content: space-between;
        box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid #eee;
    }
    .rank-circle { 
        width: 30px; height: 30px; border-radius: 50%; background: #eef6ff; 
        display: flex; align-items: center; justify-content: center; 
        font-weight: bold; color: var(--blue); margin-right: 15px;
    }
    .user-info { flex-grow: 1; text-align: left; }
    .gold-rank { background: #fff9e6 !important; border: 1px solid var(--gold) !important; }
    .my-rank { border: 2px solid var(--blue) !important; background: #f0f7ff !important; }
</style>

<div id="leaderboardPage" class="page">
    <h2 style="text-align:center; margin-top:30px;">Titan Leaders 🏆</h2>
    <p style="text-align:center; color:#888; margin-bottom:20px;">Top miners by balance</p>

    <div class="leader-item gold-rank">
        <div class="rank-circle" style="background:var(--gold); color:white;">1</div>
        <div class="user-info"><b>@ton_king</b><br><small>145.20 TON</small></div>
        <div style="font-size:20px;">🥇</div>
    </div>

    <div class="leader-item">
        <div class="rank-circle">2</div>
        <div class="user-info"><b>@crypto_titan</b><br><small>98.45 TON</small></div>
        <div style="font-size:20px;">🥈</div>
    </div>

    <div class="leader-item">
        <div class="rank-circle">3</div>
        <div class="user-info"><b>@miner_pro</b><br><small>74.12 TON</small></div>
        <div style="font-size:20px;">🥉</div>
    </div>

    <div class="leader-item my-rank">
        <div class="rank-circle" style="background:var(--blue); color:white;">?</div>
        <div class="user-info"><b>You (Your Rank)</b><br><small id="leaderMyBal">0.0000 TON</small></div>
        <div style="font-size:12px; color:var(--blue);">Mining...</div>
    </div>
</div>

<div class="nav-bar">
    <div class="nav-item active" onclick="showPage('homePage')" id="nav-home"><b>🏠</b>Home</div>
    <div class="nav-item" onclick="showPage('walletPage')" id="nav-wallet"><b>👛</b>Wallet</div>
    <div class="nav-item" onclick="showPage('boostPage')" id="nav-boosts"><b>🚀</b>Packages</div>
    <div class="nav-item" onclick="showPage('leaderboardPage')" id="nav-leaderboard"><b>🏆</b>Leaders</div>
</div>

<script>
    // JS Kısmında showPage fonksiyonuna leaderboardPage desteği ekle
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        // Navigasyon ismini düzeltmek için
        let navId = 'nav-' + pageId.replace('Page', '');
        if(document.getElementById(navId)) document.getElementById(navId).classList.add('active');
        
        // Liderlik tablosundaki bakiyeni güncelle
        if(pageId === 'leaderboardPage') {
            document.getElementById('leaderMyBal').innerText = walletBalance.toFixed(4) + " TON";
        }
        Telegram.WebApp.HapticFeedback.impactOccurred('light');
    }
</script>
