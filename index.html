<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f0f2f5; color: #333; }
        .page { display: none; padding: 20px; height: 100vh; box-sizing: border-box; }
        .active { display: block !important; }
        .card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; text-align: center; }
        
        /* Navbar */
        .nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: white; display: flex; border-top: 1px solid #ddd; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #777; cursor: pointer; }
        .nav-item.selected { color: #007aff; font-weight: bold; }
        
        .btn { background: #007aff; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
        .mining-anim { width: 100px; height: 100px; border: 5px solid #007aff; border-radius: 50%; border-top-color: transparent; margin: 20px auto; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="p-home" class="page active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div class="card" style="margin:0; padding: 10px;">💎 <span id="top-bal">0.0000</span></div>
            <button onclick="saveBal()" style="background:#2ecc71; color:white; border:none; padding:10px; border-radius:8px; font-weight:bold;">📥 Save</button>
        </div>
        
        <div id="ton-connect-btn" style="display:flex; justify-content:center; margin-bottom: 20px;"></div>

        <div class="card">
            <div id="anim" style="display:none;" class="mining-anim"></div>
            <div style="font-size: 32px; font-weight: bold; margin: 10px 0;" id="m-display">0.00000000</div>
            <p style="color:#007aff;">⚡ 0.012 PPH</p>
            <button class="btn" id="start-btn" onclick="startMining()">🚀 Start Mining</button>
        </div>
    </div>

    <div id="p-wallet" class="page">
        <h2 style="text-align:center;">Cüzdan Bilgisi</h2>
        <div class="card">
            <p style="font-size: 24px; font-weight: bold;"><span id="w-display">0.0000</span> TON</p>
        </div>
    </div>

    <div id="p-shop" class="page">
        <h2 style="text-align:center;">Market</h2>
        <div class="card">
            <p>Hız Paketi (+0.50 PPH)</p>
            <button class="btn" onclick="buySpeed()">2 TON Satın Al</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item selected" id="n-home" onclick="go('home')"><span style="font-size:20px;">🏠</span>Home</div>
        <div class="nav-item" id="n-wallet" onclick="go('wallet')"><span style="font-size:20px;">👛</span>Wallet</div>
        <div class="nav-item" id="n-shop" onclick="go('shop')"><span style="font-size:20px;">🚀</span>Shop</div>
    </div>

    <script>
        // MANIFEST KONTROLÜ
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://hakk2793.github.io/titan-uygulamasi/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        let miningBal = parseFloat(localStorage.getItem('miningBal')) || 0;
        let walletBal = parseFloat(localStorage.getItem('walletBal')) || 0;
        let isMining = localStorage.getItem('isMining') === 'true';

        // Sayfa Değiştirme Fonksiyonu (Basitleştirildi)
        function go(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('selected'));
            document.getElementById('p-' + page).classList.add('active');
            document.getElementById('n-' + page).classList.add('selected');
        }

        function startMining() {
            if(isMining) return;
            isMining = true;
            localStorage.setItem('isMining', 'true');
            document.getElementById('anim').style.display = 'block';
            document.getElementById('start-btn').innerText = "Madencilik Yapılıyor...";
            document.getElementById('start-btn').style.opacity = "0.5";
            
            setInterval(() => {
                miningBal += (0.012 / 3600);
                document.getElementById('m-display').innerText = miningBal.toFixed(8);
                localStorage.setItem('miningBal', miningBal);
            }, 1000);
        }

        function saveBal() {
            walletBal += miningBal;
            miningBal = 0;
            localStorage.setItem('walletBal', walletBal);
            localStorage.setItem('miningBal', 0);
            updateUI();
            Telegram.WebApp.showAlert("Bakiyeniz Wallet'a aktarıldı!");
        }

        function updateUI() {
            document.getElementById('m-display').innerText = miningBal.toFixed(8);
            document.getElementById('top-bal').innerText = walletBal.toFixed(4);
            document.getElementById('w-display').innerText = walletBal.toFixed(4);
        }

        async function buySpeed() {
            if(!tonConnectUI.connected) {
                Telegram.WebApp.showAlert("Lütfen önce cüzdanı bağlayın!");
                return;
            }
            // Satın alma işlemi kodları buraya gelecek
        }

        window.onload = () => {
            if(isMining) {
                isMining = false; // Döngüyü tekrar başlatmak için
                startMining();
            }
            updateUI();
        };
        Telegram.WebApp.ready();
    </script>
</body>
</html>
