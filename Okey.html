<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin 101 Okey Pro</title>
    <style>
        body { background: #1a5d3a; color: white; font-family: Arial, sans-serif; margin: 0; overflow: hidden; touch-action: none; }
        .game-container { height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }
        
        /* Üst Panel (Rakiplerin alanı temsilî) */
        .top-info { display: flex; justify-content: space-between; align-items: center; padding: 5px; background: rgba(0,0,0,0.2); border-radius: 10px; }

        /* Ana Masa / Istaka Alanı */
        .rack-area { 
            background: #4a2c16; border: 4px solid #2d1a0d; border-radius: 8px;
            height: 60vh; position: relative; box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
            margin: 10px 0;
        }

        /* Taş Tasarımı */
        .tile { 
            background: #fdf5e6; width: 42px; height: 58px; border-radius: 4px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 24px; color: black; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5); 
            position: absolute; cursor: pointer; touch-action: none; z-index: 10;
            border-bottom: 3px solid #dcdcdc;
        }

        /* Alt Panel ve Butonlar */
        .control-panel { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
        .side-btns { display: flex; flex-direction: column; gap: 5px; }
        .action-btn { background: #444; color: white; border: 1px solid #666; padding: 10px; border-radius: 5px; font-size: 12px; font-weight: bold; width: 80px; }
        .main-play-btn { background: #ffd700; color: #000; border: none; padding: 20px; border-radius: 10px; font-weight: bold; font-size: 1.2rem; flex-grow: 1; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="top-info">
        <span>👤 Aleyna</span>
        <span>🀄 Gogircin 101</span>
        <span>👤 Ömer</span>
    </div>

    <div class="rack-area" id="gameRack">
        <p id="statusMsg" style="text-align: center; margin-top: 40%;">Taşları dizmek için butona bas!</p>
    </div>

    <div class="control-panel">
        <div class="side-btns">
            <button class="action-btn">ÇİFT AÇ</button>
            <button class="action-btn" style="background: #d35400;">ÇİFT DİZ</button>
        </div>
        
        <button class="main-play-btn" id="mainBtn" onclick="dealTiles()">🎬 TAŞLARI DAĞIT</button>
        
        <div class="side-btns">
            <button class="action-btn">SERİ AÇ</button>
            <button class="action-btn" style="background: #2980b9;">SERİ DİZ</button>
        </div>
    </div>
</div>

<script>
    function dealTiles() {
        const rack = document.getElementById('gameRack');
        document.getElementById('statusMsg').style.display = 'none';
        document.getElementById('mainBtn').style.display = 'none';
        
        const colors = ['red', 'blue', 'black', 'orange'];
        for(let i=0; i<21; i++) {
            const num = Math.floor(Math.random() * 13) + 1;
            const color = colors[Math.floor(Math.random() * colors.length)];
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.style.color = color;
            tile.innerText = num;
            
            // Başlangıç konumu (Istaka içine dağıt)
            tile.style.left = (5 + (i % 7) * 13) + "%";
            tile.style.top = (i < 11 ? "20%" : "50%");

            tile.addEventListener('touchmove', function(e) {
                e.preventDefault(); 
                let touch = e.touches[0];
                let rect = rack.getBoundingClientRect();
                let x = touch.clientX - rect.left - 21;
                let y = touch.clientY - rect.top - 29;

                // Sınırlandırma
                if(x < 0) x = 0; if(y < 0) y = 0;
                if(x > rect.width - 42) x = rect.width - 42;
                if(y > rect.height - 58) y = rect.height - 58;

                tile.style.left = x + 'px';
                tile.style.top = y + 'px';
            });
            rack.appendChild(tile);
        }
    }
</script>
</body>
</html>
