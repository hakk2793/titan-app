<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin 101 Okey</title>
    <style>
        body { background: #0a4d2d; color: white; font-family: Arial; margin: 0; text-align: center; overflow: hidden; touch-action: none; }
        .table { height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; box-sizing: border-box; }
        .rack { 
            background: #4a2c16; border: 3px solid #331a0d; border-radius: 10px;
            height: 75vh; position: relative; overflow: hidden; margin-bottom: 5px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .tile { 
            background: #fdf5e6; width: 45px; height: 62px; border-radius: 6px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 26px; color: black; 
            box-shadow: 3px 3px 6px rgba(0,0,0,0.4); 
            position: absolute; cursor: pointer; touch-action: none; z-index: 10;
            user-select: none; border: 1px solid #dcdcdc;
        }
        .btn-play { background: #ffd700; color: #000; border: none; padding: 18px; border-radius: 50px; font-weight: bold; font-size: 1.3rem; width: 100%; box-shadow: 0 5px #b89b00; }
    </style>
</head>
<body>
<div class="table">
    <div><h3>🀄 Gogircin 101 Okey</h3></div>
    <div class="rack" id="gameRack">
        <p id="statusMsg" style="margin-top: 100px; opacity: 0.7;">Taşları dağıtmak için butona bas!</p>
    </div>
    <button class="btn-play" id="mainBtn" onclick="dealTiles()">🎬 TAŞLARI DAĞIT</button>
</div>

<script>
    function dealTiles() {
        const rack = document.getElementById('gameRack');
        document.getElementById('statusMsg').style.display = 'none';
        document.getElementById('mainBtn').style.display = 'none';
        
        const colors = ['red', 'blue', 'black', 'orange'];
        for(let i=0; i<21; i++) {
            const num = Math.floor(Math.random() * 13) + 1;
            const color = colors[Math.floor(Math.random() * colors.length)];
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.style.color = color;
            tile.innerText = num;
            
            // Başlangıçta rastgele ama derli toplu dağıt
            tile.style.left = Math.floor(Math.random() * 60 + 10) + "%";
            tile.style.top = Math.floor(Math.random() * 60 + 10) + "%";

            // Dokunma ve Sürükleme Mantığı (Geliştirilmiş)
            tile.addEventListener('touchstart', function(e) {
                tile.style.zIndex = "1000";
                tile.style.boxShadow = "5px 5px 15px rgba(0,0,0,0.6)";
            }, {passive: false});

            tile.addEventListener('touchmove', function(e) {
                e.preventDefault(); 
                let touch = e.touches[0];
                let rackRect = rack.getBoundingClientRect();
                
                // Parmak ucunu taşın tam ortasına getirir
                let x = touch.clientX - rackRect.left - 22;
                let y = touch.clientY - rackRect.top - 31;

                // Taşın ıstaka alanından dışarı çıkmasını engeller
                if (x < 0) x = 0;
                if (y < 0) y = 0;
                if (x > rackRect.width - 45) x = rackRect.width - 45;
                if (y > rackRect.height - 62) y = rackRect.height - 62;

                tile.style.left = x + 'px';
                tile.style.top = y + 'px';
            }, {passive: false});

            tile.addEventListener('touchend', function() {
                tile.style.zIndex = "10";
                tile.style.boxShadow = "3px 3px 6px rgba(0,0,0,0.4)";
            });

            rack.appendChild(tile);
        }
    }
</script>
</body>
</html>
