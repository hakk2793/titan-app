<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin 101 Okey Pro</title>
    <style>
        :root { --bg-green: #1a5d3a; --rack-brown: #4a2c16; --tile-white: #fdf5e6; }
        body { background: var(--bg-green); color: white; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; overflow: hidden; touch-action: none; }
        .game-container { height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 5px; box-sizing: border-box; }
        
        /* Üst Bilgi Paneli */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 5px 15px; background: rgba(0,0,0,0.4); border-radius: 20px; margin-bottom: 5px; }
        .user-tag { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: bold; }

        /* Ana Oyun Alanı */
        .main-board { flex-grow: 1; position: relative; display: flex; flex-direction: column; gap: 10px; }
        
        /* Yan Panel (Puanlar ve Göstergeler) */
        .side-stats { position: absolute; right: 5px; top: 20%; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
        .stat-box { background: rgba(0,0,0,0.6); padding: 5px; border-radius: 5px; font-size: 11px; text-align: center; border: 1px solid #555; }

        /* Istaka Alanı */
        .rack-container { 
            background: var(--rack-brown); border: 4px solid #2d1a0d; border-radius: 12px;
            height: 60vh; position: relative; box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
            margin: 0 5px; border-bottom-width: 10px;
        }

        /* Taş Tasarımı */
        .tile { 
            background: var(--tile-white); width: 44px; height: 60px; border-radius: 5px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 26px; color: black; 
            box-shadow: 3px 3px 6px rgba(0,0,0,0.5); 
            position: absolute; cursor: pointer; touch-action: none; z-index: 10;
            border-bottom: 4px solid #d1d1d1; user-select: none;
        }
        .tile-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: -2px; }

        /* Kontrol Paneli */
        .footer-controls { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; gap: 10px; }
        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        .action-btn { background: #333; color: #ddd; border: 1px solid #555; padding: 10px; border-radius: 6px; font-size: 11px; font-weight: bold; width: 85px; box-shadow: 0 3px #111; }
        .action-btn:active { transform: translateY(2px); box-shadow: 0 1px #111; }
        .deal-btn { background: linear-gradient(to bottom, #ffd700, #b89b00); color: #000; border: none; padding: 18px; border-radius: 12px; font-weight: bold; font-size: 1.2rem; flex-grow: 1; box-shadow: 0 5px #7a6700; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="top-bar">
        <div class="user-tag">👤 Aleyna</div>
        <div style="color: #ffd700; font-size: 16px;">🀄 Gogircin 101</div>
        <div class="user-tag">👤 Ömer</div>
    </div>

    <div class="main-board">
        <div class="side-stats">
            <div class="stat-box" style="color: #00bcd4;">101<br>S</div>
            <div class="stat-box" style="color: #ff9800;">13<br>G</div>
            <div class="stat-box">🎁</div>
        </div>

        <div class="rack-container" id="gameRack">
            <p id="statusMsg" style="text-align: center; margin-top: 40%; opacity: 0.5;">Masayı hazırlamak için butona bas!</p>
        </div>
    </div>

    <div class="footer-controls">
        <div class="btn-group">
            <button class="action-btn">ÇİFT AÇ</button>
            <button class="action-btn" style="background: #e67e22; color: white;">ÇİFT DİZ</button>
        </div>
        
        <button class="deal-btn" id="mainBtn" onclick="dealTiles()">🎬 TAŞLARI DAĞIT</button>
        
        <div class="btn-group">
            <button class="action-btn">SERİ AÇ</button>
            <button class="action-btn" style="background: #2980b9; color: white;">SERİ DİZ</button>
        </div>
    </div>
</div>

<script>
    function dealTiles() {
        const rack = document.getElementById('gameRack');
        document.getElementById('statusMsg').style.display = 'none';
        document.getElementById('mainBtn').style.display = 'none';
        
        const colors = ['#d32f2f', '#1976d2', '#212121', '#f57c00']; // Kırmızı, Mavi, Siyah, Turuncu
        for(let i=0; i<21; i++) {
            const num = Math.floor(Math.random() * 13) + 1;
            const colorIdx = Math.floor(Math.random() * 4);
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.style.color = colors[colorIdx];
            
            // Taş tasarımı: Sayı ve altındaki nokta
            tile.innerHTML = `<div>${num}</div><div class="tile-dot" style="background: ${colors[colorIdx]}"></div>`;
            
            // İlk dağıtımı ıstaka üzerine iki sıra yap
            tile.style.left = (6 + (i % 7) * 13) + "%";
            tile.style.top = (i < 11 ? "25%" : "55%");

            tile.addEventListener('touchmove', function(e) {
                e.preventDefault(); 
                let touch = e.touches[0];
                let rect = rack.getBoundingClientRect();
                let x = touch.clientX - rect.left - 22;
                let y = touch.clientY - rect.top - 30;

                if(x < 0) x = 0; if(y < 0) y = 0;
                if(x > rect.width - 44) x = rect.width - 44;
                if(y > rect.height - 60) y = rect.height - 60;

                tile.style.left = x + 'px';
                tile.style.top = y + 'px';
            });
            rack.appendChild(tile);
        }
    }
</script>
</body>
</html>
