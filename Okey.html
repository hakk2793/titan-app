<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gogircin 101 Okey - Otomatik Yatay</title>
    <style>
        :root { --bg-green: #1a5d3a; --rack-brown: #3e2723; }
        body { background: var(--bg-green); color: white; font-family: sans-serif; margin: 0; overflow: hidden; touch-action: none; width: 100vw; height: 100vh; }
        
        /* Yatay Mod Düzeni */
        .game-layout { height: 100%; width: 100%; display: flex; flex-direction: row; padding: 10px; box-sizing: border-box; }
        
        .side-controls { width: 12%; display: flex; flex-direction: column; justify-content: space-around; gap: 5px; }
        .action-btn { background: #333; color: #fff; border: 2px solid #555; padding: 10px 2px; border-radius: 8px; font-size: 10px; font-weight: bold; box-shadow: 0 4px #000; }
        
        .main-stage { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        .top-info { height: 35px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); border-radius: 20px; padding: 0 15px; margin-bottom: 5px; font-size: 12px; }

        .rack { 
            background: var(--rack-brown); border: 5px solid #261405; border-radius: 15px;
            flex-grow: 1; position: relative; box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
            border-bottom-width: 15px;
        }

        .tile { 
            background: #fdf5e6; width: 48px; height: 68px; border-radius: 6px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 28px; color: black; 
            box-shadow: 4px 4px 8px rgba(0,0,0,0.6); 
            position: absolute; cursor: pointer; touch-action: none; z-index: 10;
            border-bottom: 5px solid #ccc;
        }
        .tile-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: -2px; }

        .deal-btn { background: linear-gradient(#ffd700, #b89b00); color: #000; border: none; border-radius: 50%; width: 65px; height: 65px; font-weight: bold; position: absolute; bottom: 15px; right: 15px; z-index: 100; box-shadow: 0 5px #7a6700; }
    </style>
</head>
<body onload="lockOrientation()">

<div class="game-layout">
    <div class="side-controls">
        <button class="action-btn">ÇİFT AÇ</button>
        <button class="action-btn" style="background: #d35400;">ÇİFT DİZ</button>
        <button class="action-btn">YARDIM</button>
    </div>

    <div class="main-stage">
        <div class="top-info">
            <span>👤 Aleyna</span>
            <span style="color: #ffd700;">🀄 Gogircin 101 Okey</span>
            <span>👤 Ömer</span>
        </div>
        <div class="rack" id="gameRack">
            <p id="statusMsg" style="text-align: center; margin-top: 15%; opacity: 0.5;">Otomatik yatay mod aktif. Taşları dağıt!</p>
        </div>
    </div>

    <div class="side-controls">
        <button class="action-btn">SERİ AÇ</button>
        <button class="action-btn" style="background: #2980b9;">SERİ DİZ</button>
        <button class="action-btn">MENÜ</button>
    </div>

    <button class="deal-btn" id="mainBtn" onclick="dealTiles()">DAĞIT</button>
</div>

<script>
    // EKRANI YATAY MODA ZORLAMA FONKSİYONU
    async function lockOrientation() {
        try {
            if (screen.orientation && screen.orientation.lock) {
                await screen.orientation.lock('landscape');
            }
        } catch (error) {
            console.log("Yatay mod zorlaması başarısız: ", error);
        }
    }

    function dealTiles() {
        // Otomatik döndürme fonksiyonunu tekrar tetikle (bazı cihazlar için)
        lockOrientation();
        
        const rack = document.getElementById('gameRack');
        document.getElementById('statusMsg').style.display = 'none';
        document.getElementById('mainBtn').style.display = 'none';
        const colors = ['#d32f2f', '#1976d2', '#212121', '#f57c00'];

        for(let i=0; i<21; i++) {
            const num = Math.floor(Math.random() * 13) + 1;
            const colorIdx = Math.floor(Math.random() * 4);
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.style.color = colors[colorIdx];
            tile.innerHTML = `<div>${num}</div><div class="tile-dot" style="background: ${colors[colorIdx]}"></div>`;
            
            // Yatay dizilim
            tile.style.left = (5 + (i % 11) * 8.5) + "%";
            tile.style.top = (i < 11 ? "15%" : "50%");

            tile.addEventListener('touchmove', function(e) {
                e.preventDefault(); 
                let touch = e.touches[0];
                let rect = rack.getBoundingClientRect();
                let x = touch.clientX - rect.left - 24;
                let y = touch.clientY - rect.top - 34;

                if(x < 0) x = 0; if(y < 0) y = 0;
                if(x > rect.width - 48) x = rect.width - 48;
                if(y > rect.height - 68) y = rect.height - 68;

                tile.style.left = x + 'px';
                tile.style.top = y + 'px';
                tile.style.zIndex = "1000";
            });

            tile.addEventListener('touchend', () => { tile.style.zIndex = "10"; });
            rack.appendChild(tile);
        }
    }
</script>
</body>
</html>
